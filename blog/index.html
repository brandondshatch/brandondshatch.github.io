<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../page images/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../page images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../page images/favicon-16x16.png">
    
    <title>Blog | Brandon Hatch</title>
    <meta name="description" content="Thoughts on video editing, storytelling, and AI-assisted production.">
    
    <!-- Google Fonts - Inter for clean readability -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #ffffff;
            background-color: #000000;
            position: relative;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 1.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        nav .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 3rem;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 3rem;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 400;
            font-size: 0.95rem;
            transition: opacity 0.3s;
            letter-spacing: 0.3px;
        }

        nav a:hover {
            opacity: 0.6;
        }

        .cta-btn {
            padding: 0.75rem 1.5rem;
            background: #ffffff;
            color: #000000;
            border-radius: 4px;
            font-weight: 500;
        }

        .cta-btn:hover {
            opacity: 1;
            background: #f0f0f0;
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 3rem;
        }

        /* Blog Header */
        .blog-header {
            padding: 8rem 0 4rem;
            text-align: center;
        }

        .blog-title {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: rgb(230, 247, 252);
        }

        .blog-subtitle {
            font-size: 1.3rem;
            color: #cccccc;
            font-weight: 300;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: #cccccc;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #ffffff;
        }

        .back-link::before {
            content: "← ";
        }

        /* Blog Grid */
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            padding: 3rem 0;
        }

        /* Blog Post Card with Glassmorphism */
        .blog-card {
            background: rgba(18, 18, 18, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid #444444;
            border-radius: 12px;
            padding: 2rem;
            text-decoration: none;
            color: inherit;
            display: block;
            transition: all 0.3s ease;
            position: relative;
        }

        .blog-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 12px;
            padding: 1px;
            background: linear-gradient(135deg, transparent, rgba(102, 102, 102, 0.3));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .blog-card:hover {
            transform: translateY(-8px);
            background: rgba(18, 18, 18, 0.8);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(102, 102, 102, 0.5);
        }

        .blog-card:hover::before {
            opacity: 1;
        }

        .blog-card-date {
            font-size: 0.85rem;
            color: #888888;
            margin-bottom: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .blog-card-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: #ffffff;
            line-height: 1.3;
        }

        .blog-card-excerpt {
            font-size: 1rem;
            color: #cccccc;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .blog-card-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .tag {
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #444444;
            border-radius: 4px;
            color: #cccccc;
        }

        .read-more {
            display: inline-block;
            margin-top: 1rem;
            color: rgb(230, 247, 252);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .read-more::after {
            content: " →";
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #cccccc;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #ffffff;
        }

        /* Footer */
        footer {
            background: #0a0a0a;
            padding: 2rem 0;
            text-align: center;
            color: #666;
            border-top: 1px solid #222222;
            margin-top: 4rem;
        }

        /* Mobile Menu Toggle */
        .mobile-menu-toggle {
            display: none;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Responsive Design */
        @media (max-width: 968px) {
            nav .container {
                padding: 0 2rem;
                justify-content: space-between;
            }

            nav ul {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: rgba(0, 0, 0, 0.98);
                padding: 2rem;
                gap: 1rem;
            }

            nav ul.active {
                display: flex;
            }

            .mobile-menu-toggle {
                display: block;
            }

            .container {
                padding: 0 2rem;
            }

            .blog-title {
                font-size: 2.5rem;
            }

            .blog-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            nav .container {
                padding: 0 1rem;
            }

            .container {
                padding: 0 1rem;
            }

            .blog-title {
                font-size: 2rem;
            }

            .blog-header {
                padding: 6rem 0 3rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="container">
            <button class="mobile-menu-toggle" onclick="toggleMenu()">☰</button>
            <ul id="nav-menu">
                <li><a href="/">home</a></li>
                <li><a href="/#what-i-do">what i do</a></li>
                <li><a href="/#work">work</a></li>
                <li><a href="/#services">services</a></li>
                <li><a href="/blog">blog</a></li>
                <li><a href="/#contact" class="cta-btn">book a call</a></li>
            </ul>
        </div>
    </nav>

    <!-- Blog Header -->
    <section class="blog-header">
        <div class="container">
            <a href="/" class="back-link">Back to Home</a>
            <h1 class="blog-title">Blog</h1>
            <p class="blog-subtitle">Thoughts on storytelling, editing, and AI-assisted production</p>
        </div>
    </section>

    <!-- Blog Grid -->
    <section>
        <div class="container">
            <div class="blog-grid" id="blog-grid">
                <!-- Blog posts will be dynamically inserted here -->
            </div>
            <div class="empty-state" id="empty-state" style="display: none;">
                <h3>No posts yet</h3>
                <p>Check back soon for insights on video editing, storytelling, and creative workflows.</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2026 Brandon Hatch. All rights reserved.</p>
        </div>
    </footer>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('nav-menu');
            menu.classList.toggle('active');
        }

        // Close mobile menu when clicking a link
        document.querySelectorAll('nav a').forEach(link => {
            link.addEventListener('click', () => {
                const menu = document.getElementById('nav-menu');
                menu.classList.remove('active');
            });
        });

        // Close mobile menu when clicking outside
        document.addEventListener('click', (e) => {
            const nav = document.querySelector('nav');
            const menu = document.getElementById('nav-menu');

            if (!nav.contains(e.target) && menu.classList.contains('active')) {
                menu.classList.remove('active');
            }
        });

        // Load blog posts from posts.json
        async function loadBlogPosts() {
            try {
                const response = await fetch('/blog/posts.json');
                const posts = await response.json();
                
                const blogGrid = document.getElementById('blog-grid');
                const emptyState = document.getElementById('empty-state');
                
                if (posts.length === 0) {
                    emptyState.style.display = 'block';
                    return;
                }
                
                posts.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                posts.forEach(post => {
                    const card = document.createElement('a');
                    card.href = `/blog/${post.slug}.html`;
                    card.className = 'blog-card';
                    
                    const date = new Date(post.date).toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });
                    
                    let tagsHTML = '';
                    if (post.tags && post.tags.length > 0) {
                        tagsHTML = '<div class="blog-card-tags">' +
                            post.tags.map(tag => `<span class="tag">${tag}</span>`).join('') +
                            '</div>';
                    }
                    
                    card.innerHTML = `
                        <div class="blog-card-date">${date}</div>
                        <h2 class="blog-card-title">${post.title}</h2>
                        <p class="blog-card-excerpt">${post.excerpt}</p>
                        ${tagsHTML}
                        <span class="read-more">Read more</span>
                    `;
                    
                    blogGrid.appendChild(card);
                });
            } catch (error) {
                console.log('No posts.json found yet');
                document.getElementById('empty-state').style.display = 'block';
            }
        }

        // Load posts on page load
        loadBlogPosts();
    </script>
</body>
</html>
