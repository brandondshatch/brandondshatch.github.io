<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../page images/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../page images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../page images/favicon-16x16.png">
    
    <title>{{TITLE}} | Brandon Hatch</title>
    <meta name="description" content="{{EXCERPT}}">
    
    <!-- Google Fonts - Inter for clean readability -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.8;
            color: #ffffff;
            background-color: #000000;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 1.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        nav .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 3rem;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 3rem;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 400;
            font-size: 0.95rem;
            transition: opacity 0.3s;
            letter-spacing: 0.3px;
        }

        nav a:hover {
            opacity: 0.6;
        }

        .cta-btn {
            padding: 0.75rem 1.5rem;
            background: #ffffff;
            color: #000000;
            border-radius: 4px;
            font-weight: 500;
        }

        .cta-btn:hover {
            opacity: 1;
            background: #f0f0f0;
        }

        /* Article Container */
        .article-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 8rem 3rem 4rem;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: #cccccc;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #ffffff;
        }

        .back-link::before {
            content: "← ";
        }

        /* Article Header */
        .article-header {
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid #444444;
        }

        .article-title {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: rgb(230, 247, 252);
            line-height: 1.2;
        }

        .article-meta {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 1rem;
        }

        .article-date {
            font-size: 0.95rem;
            color: #888888;
            font-weight: 500;
        }

        .article-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #444444;
            border-radius: 4px;
            color: #cccccc;
        }

        /* Article Content */
        .article-content {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #cccccc;
        }

        .article-content h2 {
            font-size: 2rem;
            font-weight: 600;
            color: #ffffff;
            margin-top: 3rem;
            margin-bottom: 1rem;
        }

        .article-content h3 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #ffffff;
            margin-top: 2rem;
            margin-bottom: 0.75rem;
        }

        .article-content p {
            margin-bottom: 1.5rem;
        }

        .article-content a {
            color: rgb(230, 247, 252);
            text-decoration: underline;
            transition: opacity 0.3s;
        }

        .article-content a:hover {
            opacity: 0.7;
        }

        .article-content ul,
        .article-content ol {
            margin-bottom: 1.5rem;
            padding-left: 2rem;
        }

        .article-content li {
            margin-bottom: 0.5rem;
        }

        .article-content blockquote {
            border-left: 3px solid #444444;
            padding-left: 1.5rem;
            margin: 2rem 0;
            font-style: italic;
            color: #ffffff;
        }

        .article-content code {
            background: #121212;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.9em;
            color: rgb(230, 247, 252);
        }

        .article-content pre {
            background: #121212;
            padding: 1.5rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 2rem 0;
            border: 1px solid #444444;
        }

        .article-content pre code {
            background: transparent;
            padding: 0;
        }

        .article-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 2rem 0;
        }

        .article-content hr {
            border: none;
            border-top: 1px solid #444444;
            margin: 3rem 0;
        }

        /* Footer */
        footer {
            background: #0a0a0a;
            padding: 2rem 0;
            text-align: center;
            color: #666;
            border-top: 1px solid #222222;
            margin-top: 4rem;
        }

        /* Mobile Menu Toggle */
        .mobile-menu-toggle {
            display: none;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Responsive Design */
        @media (max-width: 968px) {
            nav .container {
                padding: 0 2rem;
                justify-content: space-between;
            }

            nav ul {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: rgba(0, 0, 0, 0.98);
                padding: 2rem;
                gap: 1rem;
            }

            nav ul.active {
                display: flex;
            }

            .mobile-menu-toggle {
                display: block;
            }

            .article-container {
                padding: 6rem 2rem 3rem;
            }

            .article-title {
                font-size: 2rem;
            }

            .article-content {
                font-size: 1rem;
            }

            .article-content h2 {
                font-size: 1.5rem;
            }

            .article-content h3 {
                font-size: 1.25rem;
            }
        }

        @media (max-width: 480px) {
            .article-container {
                padding: 6rem 1rem 2rem;
            }

            .article-title {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="container">
            <button class="mobile-menu-toggle" onclick="toggleMenu()">☰</button>
            <ul id="nav-menu">
                <li><a href="/">home</a></li>
                <li><a href="/#what-i-do">what i do</a></li>
                <li><a href="/#work">work</a></li>
                <li><a href="/#services">services</a></li>
                <li><a href="/blog">blog</a></li>
                <li><a href="/#contact" class="cta-btn">book a call</a></li>
            </ul>
        </div>
    </nav>

    <!-- Article -->
    <article class="article-container">
        <a href="/blog" class="back-link">Back to Blog</a>
        
        <header class="article-header">
            <h1 class="article-title">{{TITLE}}</h1>
            <div class="article-meta">
                <time class="article-date" datetime="{{DATE}}">{{DATE_FORMATTED}}</time>
                <div class="article-tags">
                    {{TAGS}}
                </div>
            </div>
        </header>

        <div class="article-content">
            {{CONTENT}}
        </div>
    </article>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2026 Brandon Hatch. All rights reserved.</p>
        </div>
    </footer>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('nav-menu');
            menu.classList.toggle('active');
        }

        // Close mobile menu when clicking a link
        document.querySelectorAll('nav a').forEach(link => {
            link.addEventListener('click', () => {
                const menu = document.getElementById('nav-menu');
                menu.classList.remove('active');
            });
        });

        // Close mobile menu when clicking outside
        document.addEventListener('click', (e) => {
            const nav = document.querySelector('nav');
            const menu = document.getElementById('nav-menu');

            if (!nav.contains(e.target) && menu.classList.contains('active')) {
                menu.classList.remove('active');
            }
        });
    </script>
</body>
</html>
