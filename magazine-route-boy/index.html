<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Route Boy">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#120e1a">
<title>Magazine Route Boy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  /* Arcade cabinet: one dark world, canvas centered, control card underneath */
  :root {
    --bg: #120e1a;
    --bezel: #241b30;
    --fg: #f3e6c4;
    --accent: #e9b43c;
    --muted: #9a8fae;
    --font-arcade: "Press Start 2P", "Courier New", monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-arcade);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
    padding-block: max(10px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-bottom, 0px));
    box-sizing: border-box;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
  #wrap {
    position: relative;
    width: min(100%, calc((100dvh - 90px) * 4 / 3));
    aspect-ratio: 4 / 3;
    max-width: 100%;
    border: 6px solid var(--bezel);
    border-radius: 10px;
    box-shadow: 0 0 0 2px #000, 0 18px 50px rgba(0,0,0,.6);
    background: #000;
    box-sizing: border-box;
  }
  canvas { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
  canvas:focus-visible { box-shadow: 0 0 0 3px var(--accent); }
  .help {
    font-size: 9px;
    line-height: 1.9;
    color: var(--muted);
    text-align: center;
    max-width: 640px;
    margin: 0;
  }
  .help b { color: var(--accent); font-weight: normal; }
  .touch-only { display: none; }
  #touch { display: none; width: 100%; max-width: 560px; justify-content: space-between; align-items: center; }
  .pad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 58px); gap: 3px; }
  .tb {
    background: rgba(255,255,255,.12);
    border: 2px solid rgba(255,255,255,.32);
    color: var(--fg);
    border-radius: 10px;
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    padding: 0;
  }
  .tb.down-on { background: rgba(233,180,60,.45); }
  .tb.throw { width: 116px; height: 116px; border-radius: 50%; font-family: var(--font-arcade); font-size: 11px; background: rgba(233,180,60,.28); border-color: var(--accent); }
  .tb.small { width: 64px; height: 34px; font-family: var(--font-arcade); font-size: 7px; border-radius: 8px; }
  .side { display: flex; flex-direction: column; align-items: center; gap: 12px; }

  /* phones and tablets: controls sit beside or below the screen, never over it */
  body.touch .key-only { display: none; }
  body.touch .touch-only { display: block; }
  body.touch #touch { display: flex; }
  body.touch .help { font-size: 7px; }
  @media (orientation: portrait) {
    body.touch #wrap { width: min(100%, calc((100dvh - 250px) * 4 / 3)); }
  }
  @media (orientation: landscape) {
    body.touch { padding-block: max(6px, env(safe-area-inset-top, 0px)) max(6px, env(safe-area-inset-bottom, 0px)); }
    body.touch #stage { flex-direction: row; justify-content: center; gap: 14px; }
    body.touch #touch { display: contents; }
    body.touch .pad { order: 0; }
    body.touch #wrap { order: 1; width: min(calc(100vw - 390px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)), calc((100dvh - 20px) * 4 / 3)); flex: none; }
    body.touch .pad { grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(3, 54px); }
    body.touch .tb.throw { width: 104px; height: 104px; }
    body.touch .side { order: 2; }
    body.touch .help { display: none; }
  }
  @media (max-width: 520px) { .help { font-size: 7px; } }
</style>
</head>
<body>
<main id="stage">
  <div id="wrap">
    <canvas id="game" tabindex="0" aria-label="Magazine Route Boy game screen"></canvas>
  </div>
  <div id="touch">
    <div class="pad">
      <span></span><button class="tb" data-k="up" aria-label="Run faster">&#9650;</button><span></span>
      <button class="tb" data-k="left" aria-label="Move left">&#9664;</button><span></span><button class="tb" data-k="right" aria-label="Move right">&#9654;</button>
      <span></span><button class="tb" data-k="down" aria-label="Slow down">&#9660;</button><span></span>
    </div>
    <div class="side">
      <button class="tb throw" data-k="throw" aria-label="Throw magazine">THROW</button>
      <div style="display:flex;gap:8px"><button class="tb small" data-k="pause" aria-label="Pause">PAUSE</button><button class="tb small" data-k="mute" aria-label="Sound on or off">SOUND</button></div>
    </div>
  </div>
</main>
<p class="help key-only"><b>LEFT/RIGHT</b> steer &nbsp; <b>UP</b> run faster &nbsp; <b>DOWN</b> slow down &nbsp; <b>SPACE</b> throw magazine &nbsp; <b>P</b> pause &nbsp; <b>M</b> mute<br>
Bright houses are your Return Visits (RVs). Hit the mailbox or the porch. Break an RV's window and they're a Do Not Call.</p>
<p class="help touch-only">Tap a card to pick it, tap again to start. Turn off silent mode to hear sound.</p>

<script>
(() => {
'use strict';

// =====================================================================
//  SETUP
// =====================================================================
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = 640, H = 480, RES = 2;
cv.width = W * RES; cv.height = H * RES;
const FONT = '"Press Start 2P", "Courier New", monospace';
const LOGOFONT = '"Caprasimo", "Cooper Black", Georgia, serif';
const baseT = () => ctx.setTransform(RES, 0, 0, RES, 0, 0);
baseT();

const rand = Math.random;
const rr = (a, b) => a + rand() * (b - a);
const pick = a => a[Math.floor(rand() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function shade(hex, amt) {
  const c = parseInt(hex.slice(1), 16);
  let r = c >> 16, g = (c >> 8) & 255, b = c & 255;
  if (amt < 0) { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  else { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

// =====================================================================
//  PROJECTION  (oblique 3/4 view: street runs up-right, houses on the left)
// =====================================================================
const SC = 0.78, AY = 0.42, FX = 0.62, FY = -0.78;
const CAMX = -40, OX = 300, OY = 372;
let camY = 0;
const sx = (x, y) => OX + SC * ((x - CAMX) + (y - camY) * FX);
const sy = (x, y, z) => OY + SC * ((x - CAMX) * AY + (y - camY) * FY - (z || 0));

function poly(pts, fill, stroke, lw) {
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], X = sx(p[0], p[1]), Y = sy(p[0], p[1], p[2]);
    if (i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y);
  }
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 0.8; ctx.stroke(); }
}
const quad = (x0, x1, y0, y1, c) => poly([[x0, y0, 0], [x1, y0, 0], [x1, y1, 0], [x0, y1, 0]], c);
// faces visible: y=y0 (side toward player), x=x1 (street side), top
function box(x0, x1, y0, y1, z0, z1, top, front, side, stroke) {
  if (side) poly([[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]], side, stroke);
  if (front) poly([[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], front, stroke);
  if (top) poly([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], top, stroke);
}
const frect = (x, ya, yb, za, zb, c, s) => poly([[x, ya, za], [x, yb, za], [x, yb, zb], [x, ya, zb]], c, s);
const srect = (y, xa, xb, za, zb, c, s) => poly([[xa, y, za], [xb, y, za], [xb, y, zb], [xa, y, zb]], c, s);
function line3(a, b, c, w) {
  ctx.strokeStyle = c; ctx.lineWidth = w || 1;
  ctx.beginPath(); ctx.moveTo(sx(a[0], a[1]), sy(a[0], a[1], a[2])); ctx.lineTo(sx(b[0], b[1]), sy(b[0], b[1], b[2])); ctx.stroke();
}
function faceTextY(x, y, z, s, size, color, align) {
  ctx.save();
  ctx.setTransform(RES * SC, RES * SC * AY, 0, RES * SC, RES * sx(x, y), RES * sy(x, y, z));
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = color; ctx.fillText(s, 0, 0); ctx.restore();
}
function faceTextX(x, y, z, s, size, color, align) {
  ctx.save();
  ctx.setTransform(RES * SC * FX, RES * SC * FY, 0, RES * SC, RES * sx(x, y), RES * sy(x, y, z));
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = color; ctx.fillText(s, 0, 0); ctx.restore();
}
function shadow(x, y, rx, a) {
  ctx.fillStyle = `rgba(0,0,0,${a || 0.28})`;
  ctx.beginPath(); ctx.ellipse(sx(x, y), sy(x, y, 0), rx * SC, rx * SC * 0.45, -0.25, 0, 7); ctx.fill();
}
function txt(s, x, y, size, color, align, sh) {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
  if (sh !== false) { ctx.fillStyle = sh || '#000'; ctx.fillText(s, x + Math.max(1, size / 8), y + Math.max(1, size / 8)); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// =====================================================================
//  AUDIO  (everything synthesized live)
// =====================================================================
let AC = null, master, sfxBus, musBus, revIn, noiseBuf, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = AC.createGain(); master.gain.value = muted ? 0 : 0.85;
  const comp = AC.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
  master.connect(comp); comp.connect(AC.destination);
  sfxBus = AC.createGain(); sfxBus.connect(master);
  musBus = AC.createGain(); musBus.gain.value = 0.3; musBus.connect(master);
  const conv = AC.createConvolver();
  const len = AC.sampleRate * 4, ir = AC.createBuffer(2, len, AC.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (rand() * 2 - 1) * Math.pow(1 - i / len, 3); }
  conv.buffer = ir; revIn = AC.createGain(); revIn.gain.value = 0.5; revIn.connect(conv);
  const revOut = AC.createGain(); revOut.gain.value = 0.45; conv.connect(revOut); revOut.connect(master);
  loadVoices();
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = rand() * 2 - 1;
}
function setMuted(m) {
  muted = m;
  if (master) master.gain.setTargetAtTime(m ? 0 : 0.85, AC.currentTime, 0.02);
  if (m) try { speechSynthesis.cancel(); } catch (e) {}
}
const now = () => AC.currentTime;
function env(g, t, a, peak, d, end) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + a);
  g.gain.exponentialRampToValueAtTime(end || 0.0001, t + a + d);
}
function tone(f, t, dur, type, vol, dest, f2, rev) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  env(g, t, 0.004, vol, dur);
  o.connect(g); g.connect(dest || sfxBus); if (rev) g.connect(revIn);
  o.start(t); o.stop(t + dur + 0.05);
}
function noise(t, dur, vol, type, freq, q, dest, f2) {
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = AC.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.setValueAtTime(freq || 2000, t); f.Q.value = q || 1;
  if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + dur);
  const g = AC.createGain(); env(g, t, 0.003, vol, dur);
  s.connect(f); f.connect(g); g.connect(dest || sfxBus);
  s.start(t, rand() * 0.5); s.stop(t + dur + 0.05);
}
const SFX = {
  gong() {
    if (!AC) return; const t = now() + 0.03, f = 58;
    const out = AC.createGain(); out.gain.value = 0.55; out.connect(sfxBus); out.connect(revIn);
    const parts = [[1, 1, 7], [1.5, .75, 6], [2.03, .6, 5.5], [2.72, .5, 4.5], [3.35, .42, 4], [4.13, .34, 3.5], [5.3, .25, 3], [6.75, .18, 2.4], [8.6, .12, 1.8], [11.2, .08, 1.3]];
    parts.forEach(([r, a, d], i) => {
      for (const det of [1, 1.004]) {
        const o = AC.createOscillator(), g = AC.createGain();
        o.type = 'sine'; o.frequency.setValueAtTime(f * r * det, t); o.frequency.linearRampToValueAtTime(f * r * det * 0.993, t + d);
        g.gain.setValueAtTime(0.0001, t);
        const amp = a * (det === 1 ? 0.6 : 0.35);
        if (i > 3) { g.gain.linearRampToValueAtTime(amp * 0.35, t + 0.02); g.gain.linearRampToValueAtTime(amp, t + 0.45); }
        else g.gain.linearRampToValueAtTime(amp, t + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, t + d);
        o.connect(g); g.connect(out); o.start(t); o.stop(t + d + 0.1);
      }
    });
    noise(t, 0.25, 0.8, 'lowpass', 900, 0.7, out, 200);
    tone(48, t, 1.2, 'sine', 0.9, out, 40);
  },
  throw() { if (!AC) return; noise(now(), 0.13, 0.35, 'bandpass', 2600, 2, null, 500); },
  thud() { if (!AC) return; const t = now(); tone(140, t, 0.12, 'sine', 0.5, null, 55); noise(t, 0.07, 0.3, 'lowpass', 700); },
  mailbox() { if (!AC) return; const t = now(); tone(1180, t, 0.35, 'square', 0.12, null, 1150, true); tone(1770, t, 0.28, 'triangle', 0.18, null, 0, true); tone(2650, t + 0.01, 0.5, 'sine', 0.2, null, 0, true); noise(t, 0.05, 0.3, 'highpass', 3000); },
  porch() { if (!AC) return; const t = now(); tone(160, t, 0.1, 'sine', 0.4, null, 80); tone(988, t + 0.05, 0.1, 'square', 0.08); tone(1319, t + 0.13, 0.16, 'square', 0.08); },
  glass() {
    if (!AC) return; const t = now();
    noise(t, 0.45, 0.6, 'highpass', 2500, 0.8);
    for (let i = 0; i < 12; i++) tone(rr(2400, 7000), t + rr(0, 0.35), rr(0.05, 0.15), 'sine', rr(0.05, 0.14), null, 0, true);
  },
  crash() { if (!AC) return; const t = now(); noise(t, 0.5, 0.8, 'lowpass', 1600, 0.8, null, 150); tone(520, t, 0.55, 'square', 0.16, null, 60); tone(90, t, 0.3, 'sine', 0.6, null, 40); },
  bark() {
    if (!AC) return; const t = now();
    for (const d of [0, 0.17]) {
      const o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(520, t + d); o.frequency.exponentialRampToValueAtTime(230, t + d + 0.1);
      f.type = 'bandpass'; f.frequency.value = 1000; f.Q.value = 1.5;
      env(g, t + d, 0.005, 0.5, 0.11);
      o.connect(f); f.connect(g); g.connect(sfxBus); o.start(t + d); o.stop(t + d + 0.15);
      noise(t + d, 0.08, 0.2, 'bandpass', 1500, 2);
    }
  },
  yelp() { if (!AC) return; tone(1200, now(), 0.25, 'sawtooth', 0.12, null, 500); },
  horn() { if (!AC) return; const t = now(); for (const d of [0, 0.32]) for (const f of [330, 415]) { blip(f, t + d, d ? 0.42 : 0.24, 0.13, 0.5, f * 0.97); blip(f * 2, t + d, d ? 0.42 : 0.24, 0.04, 0.25); } },
  meep() { if (!AC) return; const t = now(); for (const d of [0, 0.22]) { tone(620, t + d, 0.15, 'square', 0.09); tone(780, t + d, 0.15, 'square', 0.07); } },
  siren() {
    if (!AC) return; const t = now(), o = AC.createOscillator(), g = AC.createGain(), l = AC.createOscillator(), lg = AC.createGain();
    o.type = 'sawtooth'; o.frequency.value = 900; l.frequency.value = 2.2; lg.gain.value = 320;
    l.connect(lg); lg.connect(o.frequency);
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2200;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.08, t + 0.1); g.gain.setValueAtTime(0.08, t + 1.6); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.0);
    o.connect(f); f.connect(g); g.connect(sfxBus); o.start(t); l.start(t); o.stop(t + 2.1); l.stop(t + 2.1);
  },
  pickup() { if (!AC) return; const t = now(); [72, 76, 79, 84, 88].forEach((m, i) => tone(mf(m), t + i * 0.05, 0.1, 'triangle', 0.25)); },
  cancel() { if (!AC) return; const t = now(); [67, 63, 58].forEach((m, i) => tone(mf(m), t + i * 0.13, 0.2, 'square', 0.12)); },
  bling() { if (!AC) return; const t = now(); tone(1320, t, 0.12, 'square', 0.1); tone(1760, t + 0.07, 0.25, 'square', 0.1, null, 0, true); },
  clang() { if (!AC) return; const t = now(); tone(420, t, 0.3, 'square', 0.1, null, 380); noise(t, 0.2, 0.3, 'bandpass', 3000, 3); },
  empty() { if (!AC) return; tone(110, now(), 0.15, 'square', 0.12); },
  fanfare() { if (!AC) return; const t = now(); [[72, 0], [76, .1], [79, .2], [84, .3], [79, .45], [84, .55]].forEach(([m, d]) => { tone(mf(m), t + d, 0.22, 'square', 0.12, null, 0, true); tone(mf(m - 12), t + d, 0.22, 'triangle', 0.2); }); },
  sad() { if (!AC) return; const t = now(); [[67, 0], [66, .35], [65, .7], [64, 1.05]].forEach(([m, d]) => tone(mf(m), t + d, 0.5, 'square', 0.1, null, mf(m) * 0.97)); },
  jingle() { if (!AC) return; const t = now(); [[72, 0], [76, .09], [79, .18], [84, .27], [88, .36]].forEach(([m, d]) => tone(mf(m), t + d, 0.14, 'square', 0.1, null, 0, true)); },
  tick() { if (!AC) return; tone(1800, now(), 0.03, 'square', 0.05); },
  smash() {
    if (!AC) return; const t = now();
    noise(t, 0.3, 0.7, 'bandpass', 1400, 0.9, null, 400);
    for (let i = 0; i < 7; i++) tone(rr(700, 2200), t + rr(0, 0.2), rr(0.04, 0.1), 'triangle', rr(0.08, 0.16));
    tone(180, t, 0.15, 'sine', 0.5, null, 70);
  },
  metal() { if (!AC) return; const t = now(); tone(620, t, 0.5, 'square', 0.1, null, 560, true); tone(930, t, 0.4, 'square', 0.07, null, 900, true); noise(t, 0.12, 0.4, 'highpass', 2500); },
  pow() { if (!AC) return; const t = now(); noise(t, 0.6, 1.0, 'lowpass', 2400, 0.7, null, 120); tone(70, t, 0.5, 'sine', 0.9, null, 35); tone(300, t, 0.2, 'square', 0.15, null, 80); },
  shriek() {
    if (!AC) return; const t = now(), o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter(), v = AC.createOscillator(), vg = AC.createGain();

let houses = [], obs = [], mags = [], bundles = [], parts = [], floats = [], decor = [], people = [], donuts = [], pows = [], angels = [], bibles = [];
let carTimer = 200, hallTimer = 0;

// =====================================================================
//  WORLD BUILDING
// =====================================================================
function makeLooks() {
  G.looks = [];
  for (let i = 0; i < NL; i++) {
    G.looks.push({
      wall: pick(WALLS), roof: pick(ROOFS), door: pick(DOORS), dwall: pick(DWALLS), droof: pick(DROOFS),
      fence: rand() < 0.5 ? (rand() < 0.55 ? 'picket' : 'hedge') : null, tree: rand() < 0.35, chimney: rand() < 0.6,
      num: 100 + i * 4 + Math.floor(rand() * 3) * 2,
    });
  }
  const idx = shuffle([...Array(NL).keys()]);
  G.routes = Array(NL).fill(false);
  G.dnc = Array(NL).fill(false);
  for (let k = 0; k < DIFFS[G.diff].route; k++) G.routes[idx[k]] = true;
}

function mk(t, x, y, extra) {
  return Object.assign({ t, x, y, hx: 9, hy: 8, h: 60, vx: 0, vy: 0, solid: true, down: false, gone: false, act: false, f: 0, ph: rand() * 6, dir: 1, st: '', bub: null }, extra);
}

function buildStreet(demo) {
  WORLD = 'street';
  stopBuzz();
  houses = []; obs = []; mags = []; bundles = []; parts = []; floats = []; decor = []; people = []; donuts = []; pows = []; angels = []; bibles = [];
  const d = demo ? 1 : DIFFS[G.diff].mult * (1 + G.day * 0.16);
  // guaranteed yard dogs that chase you down the street
  const dogLots = new Set(shuffle([...Array(NL - 3).keys()].map(k => k + 2)).slice(0, demo ? 0 : Math.min(5, Math.round((2 + G.day / 2) * DIFFS[G.diff].mult))));
  for (let i = 0; i < NL; i++) {
    const L = G.looks[i], y0 = START + i * LOT;
    const h = Object.assign({ i, y0, route: G.routes[i] && !G.dnc[i], dnc: G.dnc[i], delivered: false, damaged: false, interest: false, broken: [false, false], robe: false, mbBroken: false, angel: false, angelDone: false }, L);
    houses.push(h);
    if (L.fence && i > 0) obs.push(mk('fence', (HX0 - 150) / 2, y0 + 3, { hx: (-150 - HX0) / 2, hy: 3, h: 22, kind: L.fence }));
    if (L.tree) obs.push(mk('tree', rr(-250, -180), y0 + rr(70, 220), { hx: 7, hy: 7, h: 120, hive: !demo && i > 1 && rand() < 0.45 }));
    if (!h.route && rand() < 0.55) obs.push(mk('sign', -128, y0 + rr(195, 235), { hx: 3, hy: 3, h: 40 }));
    if (rand() < 0.4) obs.push(mk('trash', -80, y0 + 236, { hx: 9, hy: 9, h: 28 }));
    if (i % 4 === 2) obs.push(mk('hydrant', -36, y0 + rr(20, 100), { hx: 5, hy: 5, h: 24 }));
    // a parked car in the driveway (windshields crack, alarms go off)
    if (!h.route && rand() < 0.45) { h.parked = true; obs.push(mk('parked', -215, y0 + 275, { hx: 46, hy: 22, h: 44, ax: true, col: pick(['#b5532c', '#3c78c4', '#7a8a3a', '#8c3b8f', '#c9b88a', '#5a5a64']) })); }
    // flower pots on the porch
    if (!h.route && rand() < 0.6) obs.push(mk('pot', -302, y0 + pick([124, 176]), { hx: 5, hy: 5, h: 20 }));
    // breakable lawn ornaments on houses that aren't on the route
    if (!h.route) {
      const nOrn = rand() < 0.7 ? 1 + (rand() < 0.4 ? 1 : 0) : 0;
      for (let k = 0; k < nOrn; k++) obs.push(mk(pick(['gnome', 'flamingo', 'birdbath', 'gnome', 'flamingo']), rr(-300, -170), y0 + (k ? rr(185, 240) : rr(60, 115)), { hx: 5, hy: 5, h: 30 }));
    }
    if (h.dnc) obs.push(mk('dncsign', -132, y0 + 205, { hx: 3, hy: 3, h: 40 }));
    if (dogLots.has(i)) {
      obs.push(mk('dog', -265, y0 + rr(90, 200), { hx: 11, hy: 6, h: 22, chaser: true, col: pick(['#8b5a2b', '#2a2622', '#a8742f']) }));
      obs.push(mk('beware', -132, y0 + rr(40, 110), { hx: 3, hy: 3, h: 40 }));
    }
    if (demo || i < 1) continue;
    let n = (rand() < 0.42 * d ? 1 : 0) + (rand() < 0.16 * d ? 1 : 0);
    const used = new Set();
    for (let k = 0; k < n; k++) {
      const pool = ['dog', 'dog', 'mormons', 'breakdancer', 'bigwheel', 'mower', 'skater', 'pioneer', 'pioneer'];
      if (!h.route) pool.push('robe', 'robe', 'robe');
      let t = pick(pool); if (used.has(t)) continue; used.add(t);
      if (t === 'dog' && !dogLots.has(i)) obs.push(mk('dog', -250, y0 + rr(90, 220), { hx: 11, hy: 6, h: 22, col: pick(['#8b5a2b', '#2a2622', '#d9c7a3', '#a8742f']) }));
      if (t === 'mormons') obs.push(mk('mormons', -60, y0 + 150, { hx: 24, hy: 7, h: 62, label: 'MORMON MISSIONARIES' }));
      if (t === 'breakdancer') { obs.push(mk('breakdancer', -66, y0 + 150, { hx: 14, hy: 12, h: 40 })); obs.push(mk('boombox', -40, y0 + 160, { hx: 8, hy: 5, h: 14 })); }
      if (t === 'bigwheel' && !L.fence && !h.parked) obs.push(mk('bigwheel', -300, y0 + 276, { hx: 12, hy: 8, h: 34 }));
      if (t === 'mower') obs.push(mk('mower', rr(-290, -150), y0 + 205, { hx: 15, hy: 8, h: 50, dir: rand() < 0.5 ? 1 : -1 }));
      if (t === 'skater') obs.push(mk('skater', -58, y0 + rr(60, 240), { hx: 8, hy: 8, h: 58 }));
      if (t === 'pioneer') obs.push(mk('pioneer', -52, y0 + rr(40, 240), { hx: 8, hy: 6, h: 60, label: 'PIONEER SISTER', col: pick(['#3a7d6b', '#8a3b5c', '#4a5a9a', '#b5683a']) }));
      if (t === 'robe') { h.robe = true; obs.push(mk('robe', -318, y0 + 150, { hx: 9, hy: 7, h: 62, solid: false, st: 'hidden', home: h })); }
    }
  }
  // magazine bundles from the literature counter
  for (const i of [3, 9, 14, 18]) {
    if (demo) break;
    if (rand() < 0.25 && i !== 3) continue;
    bundles.push({ x: pick([-62, 10, -200]), y: START + i * LOT + rr(30, 120), taken: false });
  }
  // far side of the street: trees, plus the donut shop
  for (let y = -400; y < END + 900; y += rr(140, 260)) if (y < DS_Y - 140 || y > DS_Y + 320) decor.push({ t: 'tree', x: rr(320, 380), y });
  decor.push({ t: 'donutshop', x: 390, y: DS_Y + 110, hx: 90, hy: 110 });
  if (!demo) {
    donuts.push({ x: 196, y: DS_Y - 20, taken: false });
    // one green Bible per day: an extra life
    bibles = [{ x: pick([-62, -200, 20, 110]), y: START + Math.floor(rr(4, 17)) * LOT + rr(30, 250), taken: false }];
    for (const i of shuffle([2, 5, 7, 12, 15, 17]).slice(0, 2)) donuts.push({ x: pick([-60, 20, 120]), y: START + i * LOT + rr(40, 240), taken: false });
    // the angel shows up once a day (twice later in the week)
  }
  carTimer = 140;
}

function buildHall() {
  stopBuzz();
  WORLD = 'hall';
  obs = []; mags = []; bundles = []; parts = []; floats = []; decor = []; people = [];
  const d = DIFFS[G.diff].mult * (1 + G.day * 0.14);
  // seating: rows of chairs left of the aisle
  const seats = [];
  for (let ry = 300; ry < HALL_LEN - 320; ry += 92) {
    for (let k = 0; k < 7; k++) seats.push({ x: -480 + k * 48, y: ry });
  }
  const st = G.stats;
  const nTargets = clamp(st.delivered + st.interest + 7, 10, 30);
  const chosen = new Set(shuffle([...seats.keys()]).slice(0, nTargets));
  seats.forEach((s, i) => {
    const target = chosen.has(i);
    const filler = !target && rand() < 0.35;
    decor.push({ t: 'chair', x: s.x, y: s.y, person: target || filler ? makePerson(target, i) : null });
  });
  for (const dc of decor) if (dc.person && dc.person.target) people.push(dc);
  // aisle hazards
  const kinds = ['kid', 'kid', 'chairT', 'books', 'books', 'stroller', 'attendant', 'walker', 'cart', 'mic'];
  for (let y = 420; y < HALL_LEN - 300; y += rr(170, 260) / d) {
    const t = pick(kinds), x = rr(-130, 190);
    if (t === 'kid') obs.push(mk('kid', rr(-140, 200), y, { hx: 8, hy: 7, h: 40, vx: (rand() < 0.5 ? -1 : 1) * rr(2.4, 3.4) * Math.min(1.4, d), col: pick(['#d94f3a', '#3a8ad9', '#e3c23a', '#47a856']) }));
    if (t === 'chairT') obs.push(mk('chairT', x, y, { hx: 15, hy: 12, h: 18 }));
    if (t === 'books') obs.push(mk('books', x, y, { hx: 14, hy: 11, h: 30, n: 4 + Math.floor(rand() * 4) }));
    if (t === 'stroller') obs.push(mk('stroller', x, y, { hx: 12, hy: 15, h: 40 }));
    if (t === 'attendant') obs.push(mk('attendant', x, y, { hx: 9, hy: 7, h: 62, label: 'ATTENDANT' }));
    if (t === 'walker') obs.push(mk('walker', rr(-140, 60), y, { hx: 14, hy: 8, h: 58, label: 'SISTER WITH WALKER' }));
    if (t === 'cart') obs.push(mk('cart', x, y, { hx: 14, hy: 18, h: 36 }));
    if (t === 'mic') obs.push(mk('mic', x, y, { hx: 10, hy: 7, h: 62, label: 'ROVING MIC' }));
  }
  for (const y of [900, 1900, 2800]) bundles.push({ x: rr(120, 190), y, taken: false });
  hallTimer = HALL_TIME;
}

function makePerson(target, i) {
  const sister = rand() < 0.55, old = rand() < 0.3;
  return {
    target, hit: false, sister, old, robe: target && rand() < 0.08,
    top: sister ? pick(['#c94f6d', '#3d7fb3', '#7a5ca8', '#d98b3a', '#2f8a6e', '#e3d3a8']) : pick(['#3b3f4a', '#5a4632', '#2c3e6b', '#6b6b6b', '#7a2f2f']),
    hair: old ? pick(['#d8d8d8', '#bdbdbd', '#f0f0f0']) : pick(['#2b1d12', '#5a3a1e', '#a0662b', '#e0c070', '#121212']),
    style: sister ? pick(['curly', 'bun', 'long', 'big']) : pick(['short', 'bald', 'afro', 'mullet', 'short']),
    hat: sister && rand() < 0.25 ? pick(['#2c2c54', '#7a1f3d', '#f2f2f2']) : null,
    raise: 0, thx: 0, ph: rand() * 6,
  };
}

// =====================================================================
//  GAME FLOW
// =====================================================================
function startGame() {
  G.diff = G.sel; G.score = 0; G.lives = 3; G.day = 0;
  makeLooks();
  SFX.gong(); setTimeout(() => say('Magazine Route Boy!', 1.4, 1.0, true), 700);
  beginDay();
}
function beginDay() {
  G.state = 'dayIntro'; G.t = 0; G.mags = START_MAGS; stopSong(); G.breaks = []; P.boost = 0;
  G.awakeToday = false; P.bub = null;
  G.stats = { delivered: 0, mail: 0, interest: 0, windows: 0, hallHits: 0, frames: 0, hallBonus: 0, hallDone: false };
  buildStreet(false);
  P.x = -60; P.y = 40; P.speed = CRUISE; P.crashT = 0; P.inv = 0; P.anim = 0; camY = P.y;
  if (G.day > 0) { SFX.gong(); setTimeout(() => say(DAYS[G.day].toLowerCase(), 1.3, 1, true), 600); }
}
function beginStreet() { G.state = 'street'; playSong('street'); }
function enterHall() {
  G.state = 'hallIntro'; G.t = 0; stopSong();
  G.mags = MAXM;
  buildHall();
  P.x = 120; P.y = 60; P.speed = CRUISE; P.crashT = 0; P.inv = 0; camY = P.y;
  SFX.jingle();
}
function endHall(finished) {
  if (G.stats.hallDone) return;
  G.stats.hallDone = true;
  if (finished) {
    const secs = Math.ceil(hallTimer / 60), bonus = 1000 + secs * 25;
    G.stats.hallBonus = bonus; G.score += bonus;
    SFX.fanfare(); ohWow(true);
    banner('MADE IT TO THE PLATFORM!', `+${bonus}`, 150);
  } else if (hallTimer <= 0) {
    banner('THE SONG STARTED!', 'Find a seat, brother.', 150); SFX.sad();
  } else {
    banner('YOU TRIPPED!', 'The attendant finds you a seat.', 150);
  }
  stopSong();
  setTimeout(finishDay, 2600);
}
function finishDay() {
  const st = G.stats;
  const routeHouses = houses.filter(h => h.route);
  const kept = routeHouses.filter(h => h.delivered && !h.damaged).length;
  const perfect = routeHouses.length > 0 && kept === routeHouses.length;
  const next = houses.map(h => !G.dnc[h.i] && (h.route ? (h.delivered && !h.damaged) : h.interest));
  let joined = houses.filter(h => !h.route && h.interest).length;
  let perfectBonus = 0;
  if (perfect) {
    perfectBonus = 1500; G.score += perfectBonus;
    const outside = houses.filter((h, i) => !next[i] && !G.dnc[i]);
    if (outside.length) { next[pick(outside).i] = true; joined++; }
  }
  const lost = routeHouses.filter(h => !h.delivered && !h.damaged).length;
  const newDnc = routeHouses.filter(h => h.damaged).length;
  const dncTotal = G.dnc.filter(Boolean).length;
  G.routes = next;
  const remaining = next.filter(Boolean).length;
  const hours = (st.frames / 60 / 60 * 3).toFixed(1);
  let headline;
  if (perfect) headline = 'PERFECT ROUTE! Every householder got their magazines.';
  else if (newDnc >= 2) headline = `${newDnc} return visits are now DO NOT CALLS. The elders want a word.`;
  else if (st.windows >= 3) headline = 'Neighborhood reports a rash of broken windows.';
  else if (newDnc === 1) headline = 'One return visit is now a DO NOT CALL. Mind the windows.';
  else if (lost >= 4) headline = `${lost} return visits were missed and dropped off the route.`;
  else if (lost > 0) headline = `${lost} return visit${lost > 1 ? 's' : ''} missed today.`;
  else headline = 'Steady work. The service overseer is pleased.';
  G.report = { newDnc, dncTotal, kept, lost, joined, perfect, perfectBonus, remaining, hours, headline, studies: Math.floor(st.hallHits / 4) };
  saveHi();
  if (remaining === 0) { G.endReason = 'No return visits left on your route.'; gameOver(); return; }
  G.state = 'report'; G.t = 0;
  if (perfect) { SFX.fanfare(); ohWow(true); } else SFX.jingle();
}
function nextAfterReport() {
  if (G.day >= 6) { G.state = 'win'; G.t = 0; saveHi(); SFX.fanfare(); setTimeout(() => ohWow(true), 900); return; }
  G.day++; beginDay();
}
function gameOver() {
  G.state = 'gameover'; G.t = 0; stopSong(); stopBuzz(); saveHi(); SFX.sad();
  setTimeout(() => say('Game over', 1.0, 0.9, true), 300);
}
function banner(a, b, t) { G.banner = { a, b, t: t || 120, max: t || 120 }; }
function float(x, y, z, s, col) { floats.push({ x, y, z, s, col: col || '#fff', t: 60 }); }
function bubble(o, s, t) { o.bub = { s, t: t || 110 }; }

// =====================================================================
//  PLAYER ACTIONS
// =====================================================================
function throwMag() {
  if (G.mags <= 0) { SFX.empty(); float(P.x, P.y, 80, 'OUT OF MAGS!', '#ff6b6b'); P.cool = 20; return; }
  G.mags--;
  if (G.mags === 3) { setTimeout(SFX.low, 150); float(P.x, P.y, 90, 'LOW ON MAGS!', '#ffb347'); }
  mags.push({ x: P.x - 8, y: P.y + 4, z: 40, vx: -8.6, vy: P.speed + 0.5, vz: 2.6, spin: 0, done: false, rest: 0, dead: false, cover: rand() < 0.5 ? 'w' : 'a' });
  P.throwT = 14; P.cool = 11;
  SFX.throw();
}
function crash(o) {
  P.crashT = 100; P.crashBy = o; P.speed = 0; P.boost = 0;
  SFX.crash(); SFX.pow(); if (o && o.t === 'bees') SFX.sting();
  // losing a life gets one of his lines; a trip in the hall doesn't cost a life
  if (WORLD === 'street') boyLine(pick(['At least there\'s the resurrection.', 'Tough territory.', 'I\'ll make it a matter of prayer.']), 200);
  else boyLine('Ouch. Dude.', 120);
  pows.push({ x: P.x, y: P.y, t: 50 }); G.shake = 18;
  if (o && o.t === 'police') setTimeout(() => say('Slow down, son!', 0.8, 1, true), 2600);
  if (o && o.t === 'cargroup') setTimeout(() => say('Oh dear! Are you alright, brother?', 1.7, 1.1, true), 2600);
  for (let i = 0; i < 6; i++) parts.push({ x: P.x, y: P.y, z: 30, vx: rr(-3, 3), vy: rr(-2, 3), vz: rr(2, 5), life: 80, kind: 'mag' });
  if (WORLD === 'street') G.lives--;
}
function afterCrash() {
  if (WORLD === 'hall') { endHall(false); return; }
  if (G.lives <= 0) { G.endReason = 'You ran out of energy. Time for a coffee break.'; gameOver(); return; }
  P.inv = 110; P.speed = MINS;
  const o = P.crashBy;
  if (o && o.t === 'khwall') { P.y = END - 150; camY = P.y; }
  if (o && ['dog', 'robe', 'skater', 'mormons', 'pioneer', 'kid', 'bigwheel'].includes(o.t)) o.gone = true;
  if (o && o.t === 'bees') { o.gone = true; if (o.stopBuzz) { o.stopBuzz(); o.stopBuzz = null; } }
}

function houseAt(y) {
  const i = Math.floor((y - START) / LOT);
  return i >= 0 && i < NL ? houses[i] : null;
}
function deliver(h, kind, m) {
  if (h.dnc) { SFX.thud(); return; }
  const zx = kind === 'mail' ? MBX : -320, zy = kind === 'mail' ? h.y0 + MBY : h.y0 + 150;
  if (h.angel && !h.angelDone && !h.damaged) {
    h.angelDone = true; h.interest = true; G.stats.interest++; G.stats.angel = (G.stats.angel || 0) + 1;
    G.score += 1000; float(zx, zy, 90, 'THE ANGEL DIRECTED YOU! 1000', '#fff6a8'); SFX.harp(); SFX.oneUp();
    setTimeout(() => ohWow(true), 500);
    for (let i = 0; i < 20; i++) parts.push({ x: zx, y: zy, z: 40, vx: rr(-2, 2), vy: rr(-2, 2), vz: rr(2, 6), life: 70, kind: 'gold' });
    return;
  }
  if (h.route) {
    if (h.damaged || h.delivered) { SFX.thud(); return; }
    h.delivered = true; G.stats.delivered++;
    if (kind === 'mail') { G.score += 250; G.stats.mail++; float(zx, zy, 60, 'RV! MAILBOX 250', '#ffe36b'); SFX.mailbox(); ohWow(); }
    else { G.score += 100; float(zx, zy, 60, 'RV! PORCH 100', '#fff'); SFX.porch(); }
  } else {
    if (h.interest) { SFX.thud(); return; }
    h.interest = true; G.stats.interest++; G.score += 50;
    float(zx, zy, 70, 'NEW INTEREST! 50', '#8ef0a0'); SFX.interest();
  }
}
function hitHouse(h, rel, z) {
  for (let w = 0; w < 2; w++) {
    const [a, b] = WINS[w];
    if (rel >= a && rel <= b) {
      if (h.broken[w]) { SFX.thud(); return; }
      h.broken[w] = true; SFX.glass(); SFX.crashBig(); G.stats.windows++; G.shake = Math.max(G.shake, 9);
      burst(-330, h.y0 + (a + b) / 2, 70, 'CRASH!');
      for (let i = 0; i < 22; i++) parts.push({ x: -328, y: h.y0 + (a + b) / 2 + rr(-15, 15), z: (WZ0 + WZ1) / 2 + rr(-15, 15), vx: rr(0.5, 4), vy: rr(-2, 2), vz: rr(-1, 4), life: 60, kind: 'glass' });
      // first window of the day always gets the joke; after that, now and then
      const awake = G.t - G.lastAwake > 900 && G.t - G.lastCounsel > 240 && (!G.awakeToday || rand() < 0.3);
      if (awake) {
        G.lastAwake = G.t; G.awakeToday = true;
        setTimeout(() => { SFX.shriek(); float(-330, h.y0 + (a + b) / 2, 120, 'EEEEEK!', '#ff9ad0'); bubbleAt(-330, h.y0 + (a + b) / 2, 'EEEEEK!'); }, 250);
        setTimeout(() => boyLine("That's why they call it the Awake."), 1300);
      }
      registerBreak(awake);
      if (h.route) makeDnc(h);
      else { G.score += 100; float(-330, h.y0 + (a + b) / 2, 100, '100', '#fff'); if (rand() < 0.35) ohWow(); }
      return;
    }
  }
  if (rel >= 126 && rel <= 174) { deliver(h, 'porch'); return; }
  // porch light beside the door
  if (rel >= 108 && rel <= 125 && z > 30 && !h.lightBroken) {
    h.lightBroken = true; SFX.glass(); burst(-330, h.y0 + 120, 62, 'POP!');
    if (h.route) makeDnc(h);
    else { G.score += 50; float(-330, h.y0 + 120, 90, '50', '#fff'); }
    registerBreak(); return;
  }
  SFX.thud();
}
// smashing a return visit's house turns it into a Do Not Call for the rest of the week
function makeDnc(h) {
  if (h.damaged) return;
  h.damaged = true; G.dnc[h.i] = true;
  float(-330, h.y0 + 150, 110, 'DO NOT CALL!', '#ff6b6b'); setTimeout(SFX.cancel, 350);
  obs.push(mk('dncsign', -132, h.y0 + 205, { hx: 3, hy: 3, h: 40, act: true }));
}
function bubbleAt(x, y, s) { const o = mk('speech', x, y, { solid: false, hx: 1, hy: 1, h: 90, act: true, t: 90 }); bubble(o, s, 90); obs.push(o); }
function burst(x, y, z, text, col) { pows.push({ x, y, z, t: 40, max: 40, text, col }); }
function releaseBees(tree) {
  tree.hiveOut = true;
  const b = mk('bees', tree.x + 10, tree.y, { hx: 10, hy: 9, h: 70, act: true, ct: 330, label: 'BEES!' });
  b.stopBuzz = buzzStart();
  obs.push(b); SFX.smash(); bubble(b, 'BZZZZ!', 80);
}
function stopBuzz() { for (const o of obs) if (o.stopBuzz) { o.stopBuzz(); o.stopBuzz = null; } }
function debris(o, col, n) {
  for (let i = 0; i < n; i++) parts.push({ x: o.x, y: o.y, z: 15, vx: rr(-3, 3), vy: rr(-3, 3), vz: rr(2, 6), life: 55, kind: 'chip', col });
}
// a streak of property damage sometimes gets a remark
function registerBreak(quiet) {
  G.breaks.push(G.t);
  G.breaks = G.breaks.filter(t => G.t - t < 600);
  if (!quiet && G.breaks.length >= 3 && G.t - G.lastCounsel > 1200) {
    G.lastCounsel = G.t; G.breaks = [];
    // if the Awake joke is still playing, wait for it to finish
    const wait = Math.max(450, (G.lastAwake + 215 - G.t) * 1000 / 60);
    setTimeout(() => boyLine("Oh wow. I'm gonna get counseled."), wait);
  }
}
function magHitsObstacle(o) {
  const pts = (n, s, c) => { G.score += n; float(o.x, o.y, o.h + 20, s || String(n), c); };
  switch (o.t) {
    case 'dog': if (!o.down) { o.down = true; o.dt = 150; o.solid = false; o.st = 'done'; pts(100); SFX.yelp(); } break;
    case 'mormons': if (o.st !== 'trade') { o.st = 'trade'; o.vy = 0; pts(300, 'LITERATURE SWAP! 300', '#8ef0a0'); bubble(o, "WE'LL READ YOURS IF YOU READ OURS!", 160); SFX.bling(); } break;
    case 'breakdancer': if (!o.down) { o.down = true; pts(150); SFX.thud(); } break;
    case 'trash': if (!o.down) { o.down = true; o.solid = false; pts(50); SFX.metal(); burst(o.x, o.y, 30, 'CLANG!'); debris(o, '#a9afb7', 8); registerBreak(); } break;
    case 'parked':
      if (!o.cracked) { o.cracked = true; o.alarm = 110; pts(150); SFX.glass(); SFX.carAlarm(); burst(o.x, o.y, 50, 'CRACK!'); G.shake = Math.max(G.shake, 6); debris(o, '#bfe3f2', 12); registerBreak(); }
      else SFX.clang();
      break;
    case 'pot': case 'gnome': case 'flamingo': case 'birdbath':
      if (!o.down) { o.down = true; o.solid = false; pts(100); SFX.smash(); burst(o.x, o.y, 30, 'SMASH!'); G.shake = Math.max(G.shake, 4); debris(o, o.t === 'flamingo' ? '#ff7eb6' : o.t === 'gnome' ? '#d93a2a' : o.t === 'pot' ? '#c4622d' : '#b9b9c0', 16); registerBreak(); }
      break;
    case 'speech': break;
    case 'sign': case 'beware': case 'dncsign': if (!o.down) { o.down = true; pts(25); SFX.thud(); } break;
    case 'tree': if (o.hive && !o.hiveOut) { pts(50, 'BEEHIVE! 50', '#ffe14d'); releaseBees(o); } else SFX.thud(); break;
    case 'bees': break;
    case 'bigwheel': if (!o.down) { o.down = true; o.vx = 0; pts(100); bubble(o, 'MOM!!'); SFX.thud(); } break;
    case 'robe': if (o.st !== 'retreat' && o.st !== 'hidden') { o.st = 'retreat'; pts(200, 'HMPH! 200'); bubble(o, 'HMPH!'); SFX.thud(); } break;
    case 'mower': if (!o.down) { o.down = true; pts(100); SFX.clang(); } break;
    case 'skater': if (!o.down) { o.down = true; o.solid = false; o.vy = 0; pts(100); SFX.thud(); } break;
    case 'pioneer': if (!o.thx) { o.thx = 1; pts(50); bubble(o, 'ALREADY HAVE IT, DEAR!'); SFX.thud(); } break;
    case 'car': pts(50); SFX.clang(); break;
    case 'cargroup': if (!o.thx) { o.thx = 1; pts(150, 'FOR THE CAR GROUP! 150', '#ffe36b'); bubble(o, 'THANK YOU, DEAR!'); SFX.bling(); } else SFX.thud(); break;
    case 'police': bubble(o, 'HEY!'); SFX.clang(); break;
    case 'kid': if (!o.thx) { o.thx = 1; pts(50); bubble(o, 'COOL!'); SFX.bling(); } break;
    case 'attendant': bubble(o, 'NO RUNNING IN THE HALL!'); SFX.thud(); break;
    case 'walker': if (!o.thx) { o.thx = 1; pts(100); bubble(o, 'THANK YOU, SWEETIE!'); SFX.bling(); } break;
    case 'mic': if (!o.thx) { o.thx = 1; pts(50); bubble(o, 'NICE COMMENT!'); SFX.bling(); } break;
    default: SFX.thud();
  }
}

function overlap(a, ahx, ahy, b) { return Math.abs(a.x - b.x) < ahx + b.hx && Math.abs(a.y - b.y) < ahy + b.hy; }

function stepPlayer(xmin, xmax) {
  const bm = P.boost > 0 ? 1.45 : 1;
  if (P.boost > 0) { P.boost--; if (P.boost % 4 === 0) parts.push({ x: P.x - 6, y: P.y - 4, z: rr(10, 50), vx: rr(-0.5, 0.5), vy: 0, vz: 0.3, life: 30, kind: 'sugar', col: pick(['#ff6fa0', '#ffe14d', '#7ad1ff', '#fff']) }); }
  const target = (keys.up ? MAXS : keys.down ? MINS : CRUISE) * bm;
  P.speed += (target - P.speed) * 0.05;
  const lat = 3.3 * (P.boost > 0 ? 1.15 : 1);
  if (keys.left) P.x -= lat;
  if (keys.right) P.x += lat;
  P.x = clamp(P.x, xmin, xmax);
  P.y += P.speed;
  P.anim += 0.08 + P.speed * 0.085;
  const stepIdx = Math.floor(P.anim / Math.PI);
  if (stepIdx !== P.lastStep) { P.lastStep = stepIdx; SFX.step(); }
  if (P.inv > 0) P.inv--;
  if (P.cool > 0) P.cool--;
  if (P.throwT > 0) P.throwT--;
  if (take('throw') && P.cool === 0) throwMag();
}

function stepStreet() {
  G.stats.frames++;
  if (P.crashT > 0) { if (--P.crashT === 0) afterCrash(); }
  else stepPlayer(XMIN, XMAX);
  camY = P.y;
  updateObstacles();
  updateMags();
  spawnCars();
  if (P.crashT === 0 && P.inv === 0) {
    for (const o of obs) if (o.solid && !o.gone && o.act && overlap(P, 8, 6, o)) { crash(o); break; }
  }
  for (const b of bundles) if (!b.taken && Math.abs(b.x - P.x) < 18 && Math.abs(b.y - P.y) < 16 && P.crashT === 0) {
    b.taken = true; G.mags = Math.min(MAXM, G.mags + 10); SFX.pickup(); float(b.x, b.y, 50, 'MAGAZINES +10', '#ffe36b');
  }
  for (const b of bibles) if (!b.taken && Math.abs(b.x - P.x) < 16 && Math.abs(b.y - P.y) < 14 && P.crashT === 0) {
    b.taken = true; G.lives = Math.min(6, G.lives + 1);
    SFX.oneUp(); burst(P.x, P.y, 80, '1-UP', 'green'); float(P.x, P.y, 100, 'EXTRA LIFE!', '#8ef0a0');
    setTimeout(() => boyLine('Best life ever.'), 250);
  }
  for (const d of donuts) if (!d.taken && Math.abs(d.x - P.x) < 16 && Math.abs(d.y - P.y) < 14 && P.crashT === 0) {
    d.taken = true; P.boost = 480; SFX.donut(); setTimeout(SFX.power, 300); float(d.x, d.y, 50, 'SUGAR RUSH!', '#ff9ad0');
    if (rand() < 0.5) setTimeout(() => boy('Mmm. Donut.'), 300);
  }
  updateAngels();
  if (P.y >= END - 26 && P.crashT === 0) {
    if (Math.abs(P.x) < 46) enterHall();
    else { P.y = END - 27; crash({ t: 'khwall' }); }
  }
}

function updateAngels() {
  for (const a of angels) {
    a.t++;
    if (a.st === 'wait') {
      if (P.y < a.trig) continue;
      const cand = houses.filter(h => !h.route && !h.damaged && !h.angel && h.y0 > P.y + 380 && h.y0 < P.y + 1500);
      if (!cand.length) { a.trig += LOT; continue; }
      a.h = pick(cand); a.st = 'fly'; a.x = 120; a.y = P.y - 300; a.z = 150; a.t = 0;
      SFX.harp();
    } else if (a.st === 'fly') {
      const tx = -170, ty = a.h.y0 + 150, tz = 125;
      const dx = tx - a.x, dy = ty - a.y, dz = tz - a.z, d = Math.hypot(dx, dy, dz);
      const sp = Math.max(P.speed + 3, 6);
      if (d < sp) { a.st = 'point'; a.h.angel = true; a.t = 0; float(-330, a.h.y0 + 150, 95, 'DEFINITELY INTERESTED!', '#fff6a8'); SFX.harp(); }
      else { a.x += dx / d * sp; a.y += dy / d * sp; a.z += dz / d * sp; }
    } else if (a.st === 'point') {
      a.z = 125 + Math.sin(a.t * 0.06) * 6;
      if (a.h.angelDone || a.h.damaged || P.y > a.h.y0 + 330) { a.st = 'leave'; a.t = 0; }
      if (a.t % 10 === 0 && !a.h.angelDone) parts.push({ x: -326, y: a.h.y0 + rr(120, 180), z: rr(10, 70), vx: 0.3, vy: 0, vz: 0.6, life: 40, kind: 'gold' });
    } else if (a.st === 'leave') {
      a.z += 3; a.y += 5; a.x += 1.5;
      if (a.t > 120) a.st = 'gone';
    }
  }
}

function stepHall() {
  if (P.crashT > 0) { if (--P.crashT === 0) afterCrash(); }
  else if (!G.stats.hallDone) {
    stepPlayer(-150, 210);
    hallTimer--;
    if (hallTimer % 60 === 0 && hallTimer <= 600 && hallTimer > 0) SFX.tick();
    if (hallTimer <= 0) endHall(false);
  } else { P.speed *= 0.9; P.y += P.speed; P.anim += P.speed * 0.08; }
  if (P.y > HALL_LEN - 20) { if (!G.stats.hallDone) endHall(true); P.y = Math.min(P.y, HALL_LEN + 40); P.speed *= 0.8; }
  camY = Math.min(P.y, HALL_LEN + 160);
  updateObstacles();
  updateMags();
  for (const c of people) {
    const pp = c.person, dy = c.y - P.y;
    pp.raise = !pp.hit && dy > -40 && dy < 520 ? Math.min(1, pp.raise + 0.08) : Math.max(0, pp.raise - 0.08);
    if (pp.thx > 0) pp.thx--;
  }
  if (P.crashT === 0 && P.inv === 0 && !G.stats.hallDone) {
    for (const o of obs) if (o.solid && !o.gone && o.act && overlap(P, 8, 6, o)) { crash(o); break; }
  }
  for (const b of bundles) if (!b.taken && Math.abs(b.x - P.x) < 20 && Math.abs(b.y - P.y) < 18) {
    b.taken = true; G.mags = Math.min(MAXM, G.mags + 10); SFX.pickup(); float(b.x, b.y, 50, 'MAGAZINES +10', '#ffe36b');
  }
}

function spawnCars() {
  if (--carTimer > 0) return;
  const d = DIFFS[G.diff].mult * (1 + G.day * 0.12);
  carTimer = Math.floor(rr(260, 480) / d);
  if (P.y > END - 700) return;
  const aheadOK = camY + 1150 < CROSS_Y - 120;
  let r = rand();
  if (!aheadOK) { if (r < 0.62) return; r = 0.99; }
  const busy = (lane, y0, y1) => obs.some(o => !o.gone && (o.t === 'car' || o.t === 'cargroup' || o.t === 'police') && Math.abs(o.x - lane) < 40 && o.y > y0 && o.y < y1);
  if (r < 0.32) {
    if (busy(34, camY + 300, camY + 1500)) return;
    obs.push(mk('cargroup', 34, camY + 1100, { hx: 24, hy: 50, h: 46, vy: rr(1.1, 1.5), act: true, label: 'CAR GROUP', home: 34, swerveT: 120 }));
  } else if (r < 0.62) {
    const oncoming = rand() < 0.6;
    const lane = oncoming ? 160 : 44;
    if (busy(lane, camY - 200, camY + 1500)) return;
    obs.push(mk('car', lane, camY + 1150, { hx: 23, hy: 44, h: 42, vy: oncoming ? -(2.4 + d * 0.6) : rr(1.4, 1.9), act: true, col: pick(['#d9532c', '#3c78c4', '#e0c341', '#4e9a5a', '#8c3b8f', '#c9c9c9']) }));
  } else {
    const behind = !aheadOK || rand() < 0.45;
    if (behind) {
      obs.push(mk('police', 92, camY - 520, { hx: 24, hy: 48, h: 46, vy: P.speed + 3 + d * 0.4, act: true, label: 'LOCAL POLICE', behind: true }));
      SFX.siren();
    } else {
      if (busy(160, camY - 200, camY + 1500)) return;
      obs.push(mk('police', 160, camY + 1150, { hx: 24, hy: 48, h: 46, vy: -(3.4 + d * 0.6), act: true, label: 'LOCAL POLICE' }));
    }
  }
}

function moveToward(o, tx, ty, sp) {
  const dx = tx - o.x, dy = ty - o.y, d = Math.hypot(dx, dy) || 1;
  o.x += dx / d * sp; o.y += dy / d * sp;
  const scr = dx + dy * FX; if (Math.abs(scr) > 0.5) o.dir = scr > 0 ? 1 : -1;
}

function updateObstacles() {
  for (const o of obs) {
    if (o.gone) continue;
    const dy = o.y - P.y;
    if (!o.act) { if (dy < 700) o.act = true; else continue; }
    o.f++; o.ph += 0.16;
    if (o.bub && --o.bub.t <= 0) o.bub = null;
    if (o.t === 'speech' && !o.bub) { o.gone = true; continue; }
    if (o.label && !o.labeled && dy < 430) { o.labeled = 140; }
    if (o.labeled > 1) o.labeled--;
    switch (o.t) {
      case 'dog':
        if (o.down) { if (--o.dt <= 0) { o.down = false; } break; }
        if (o.st === '' && dy < (o.chaser ? 300 : 270) && dy > -40) { o.st = 'chase'; o.ct = o.chaser ? 420 + G.day * 20 : 150 + G.day * 14; SFX.bark(); if (o.chaser) setTimeout(SFX.growl, 350); bubble(o, o.chaser ? 'GRRR... WOOF!' : 'WOOF!', 70); }
        if (o.st === 'chase') {
          moveToward(o, P.x, P.y + 4, o.chaser ? 3.15 + G.day * 0.08 : 2.9 + G.day * 0.1);
          o.x = clamp(o.x, -330, 215); o.moving = true;
          if (o.f % 38 === 0) SFX.bark();
          if (--o.ct <= 0 || dy < -560 || P.crashT > 0) o.st = 'done';
        } else o.moving = false;
        break;
      case 'mormons':
        if (o.st !== 'trade') {
          o.vy = -1.25; o.y += o.vy; o.dir = -1;
          if (!o.said && dy < 330) { o.said = true; bubble(o, 'HEY! SAME LINE OF WORK!', 150); say('Hey, brother! Same line of work!', 1.1, 1.05); }
        }
        break;
      case 'breakdancer': break;
      case 'tree':
        if (o.hive && !o.hiveOut && Math.abs(dy) < 50 && Math.abs(o.x - P.x) < 60 && P.crashT === 0) releaseBees(o);
        break;
      case 'bees':
        o.ct--;
        moveToward(o, P.x + Math.sin(o.f * 0.2) * 14, P.y + Math.cos(o.f * 0.17) * 10, 3.3 + G.day * 0.05);
        if (o.ct <= 0 || dy < -600 || P.crashT > 0 && P.crashBy !== o) { o.gone = true; if (o.stopBuzz) { o.stopBuzz(); o.stopBuzz = null; } }
        break;
      case 'bigwheel':
        if (!o.down) {
          if (o.st === '' && dy < 290) { o.st = 'go'; o.vx = 2.3 + G.day * 0.15; }
          if (o.st === 'go') { o.x += o.vx; if (o.x > 240) o.gone = true; }
        }
        break;
      case 'robe':
        if (o.st === 'hidden') {
          if (dy < 190 && dy > -40) { o.st = 'chase'; o.solid = true; o.ct = 170; bubble(o, 'NOT INTERESTED!', 120); say('Not interested!', 0.6, 1.1, true); }
        } else if (o.st === 'chase') {
          moveToward(o, P.x, P.y, 2.2); o.moving = true; o.x = clamp(o.x, -330, 100);
          if (--o.ct <= 0) { o.st = 'stop'; o.moving = false; }
        } else if (o.st === 'retreat') {
          moveToward(o, -322, o.home.y0 + 150, 2.4); o.moving = true; o.solid = false;
          if (Math.abs(o.x + 322) < 4) o.gone = true;
        }
        break;
      case 'mower':
        if (!o.down) { o.x += o.dir * 1.1; if (o.x < -300) o.dir = 1; if (o.x > -140) o.dir = -1; }
        break;
      case 'skater':
        if (!o.down && dy < 600) { o.vy = -3.2; o.y += o.vy; o.dir = -1; }
        break;
      case 'pioneer':
        o.vy = 1.35; o.y += o.vy; o.dir = 1; o.moving = true;
        if (!o.said && dy < 200) { o.said = true; bubble(o, 'GOT MY HOURS IN!', 140); }
        break;
      case 'car': case 'police': case 'cargroup':
        // same-direction traffic turns right onto the side street before the Kingdom Hall
        if (!o.turn && o.vy > 0 && o.y > CROSS_Y - 30) { o.turn = true; o.ax = true; o.y = CROSS_Y; o.hx = o.t === 'cargroup' ? 50 : 46; o.hy = 24; o.vy = 0; o.vx = 3.4; }
        if (o.turn) { o.x += o.vx; if (o.x > 900) o.gone = true; if (o.t === 'police' && o.f % 140 === 1) SFX.siren(); break; }
        if (o.t === 'cargroup') {
          o.y += o.vy;
          if (--o.swerveT <= 0) { o.tx = o.tx === -2 ? o.home : (rand() < 0.5 ? -2 : o.home); o.swerveT = rr(90, 200); }
          if (o.tx != null) o.x += clamp(o.tx - o.x, -0.7, 0.7);
          if (!o.said && dy < 260 && dy > -60) { o.said = true; SFX.meep(); bubble(o, 'NEED A RIDE, BROTHER?', 150); say('Need a ride, brother?', 1.8, 1.05); }
          if (o.y < camY - 800) o.gone = true;
          break;
        }
        o.y += o.vy;
        if (o.t === 'police' && o.f % 140 === 1 && Math.abs(dy) < 900) SFX.siren();
        if (o.t === 'car' && !o.honked && Math.abs(dy) < 300 && Math.abs(o.x - P.x) < 110) { o.honked = true; SFX.horn(); bubble(o, 'HONK HONK!', 70); }
        if (o.y < camY - 800 || o.y > camY + 2200) o.gone = true;
        break;
      // hall
      case 'kid':
        o.x += o.vx; o.moving = true; o.dir = o.vx > 0 ? 1 : -1;
        if (o.x < -150) o.vx = Math.abs(o.vx); if (o.x > 215) o.vx = -Math.abs(o.vx);
        break;
      case 'attendant':
        if (dy < 500) { o.y -= 0.6; o.moving = true; o.dir = -1; if (!o.said && dy < 300) { o.said = true; bubble(o, 'NO RUNNING IN THE HALL!', 150); say('No running in the hall!', 0.8, 1.05); } }
        break;
      case 'walker':
        if (dy < 600) { o.x += 0.45; o.moving = true; o.dir = 1; if (o.x > 200) o.x = -140; if (!o.said && dy < 280) { o.said = true; bubble(o, 'GOOD MORNING, BROTHER!', 140); } }
        break;
      case 'mic':
        if (dy < 500) { o.x += Math.sin(o.f * 0.02) * 1.2; o.moving = true; o.dir = Math.cos(o.f * 0.02) > 0 ? 1 : -1; }
        break;
    }
  }
  if (obs.length > 140) obs = obs.filter(o => !o.gone);
}

function updateMags() {
  for (const m of mags) {
    if (m.dead) continue;
    const px0 = m.x;
    m.x += m.vx; m.y += m.vy;
    if (m.z > 0 || m.vz > 0) {
      m.z += m.vz; m.vz -= 0.22; m.spin += 0.5;
      if (m.z <= 0) { m.z = 0; if (m.vz < -1.6) m.vz = -m.vz * 0.25; else m.vz = 0; }
    }
    if (m.z === 0 && m.vz === 0) {
      m.vx *= 0.87; m.vy *= 0.87;
      if (Math.abs(m.vx) + Math.abs(m.vy) < 0.3) { m.vx = m.vy = 0; m.rest++; }
    }
    if (m.rest > 100 || m.y < camY - 700) { m.dead = true; continue; }
    if (m.done) continue;
    if (WORLD === 'street') {
      const h = houseAt(m.y);
      if (h) {
        const rel = m.y - h.y0;
        if (!h.mbBroken && Math.abs(m.x - MBX) < 12 && Math.abs(rel - MBY) < 14 && m.z > 14 && m.z < 56) {
          if (h.route || h.angel && !h.angelDone) deliver(h, 'mail', m);
          else {
            h.mbBroken = true; G.score += 100; float(MBX, h.y0 + MBY, 60, '100', '#fff'); SFX.metal(); burst(MBX, h.y0 + MBY, 45, 'BONK!'); G.shake = Math.max(G.shake, 4);
            debris({ x: MBX, y: h.y0 + MBY }, '#55585f', 10); registerBreak();
          }
          stopMag(m); continue;
        }
        if (m.x <= HX1 && px0 > HX1 && rel >= HYA && rel <= HYB) { hitHouse(h, rel, m.z); m.done = true; m.x = HX1 - 1; m.vx = 0.8; m.vy *= 0.3; continue; }
        if (m.z < 4 && m.x <= -292 && m.x >= -334 && rel >= 116 && rel <= 184) { deliver(h, 'porch', m); m.done = true; continue; }
        if (m.x < HX1 && rel > HYA - 10 && rel < HYB) { m.done = true; m.vx = 0; m.vy = 0; continue; }
      }
      if (m.x < -560) { m.done = true; m.vx = 0; }
    } else {
      for (const c of people) {
        const pp = c.person;
        if (!pp.hit && Math.abs(m.x - c.x) < 17 && Math.abs(m.y - c.y) < 18 && m.z < 80) {
          pp.hit = true; pp.thx = 120; G.stats.hallHits++; G.score += 250;
          float(c.x, c.y, 80, '250', '#ffe36b'); SFX.coin();
          if (rand() < 0.4) say(pick(['Thank you, brother!', 'Oh, the new issue!', 'Thank you!']), pp.sister ? 1.6 : 0.9, 1.1);
          stopMag(m); break;
        }
      }
      if (m.done) continue;
      if (m.x < -560) { m.done = true; m.vx = 0; }
    }
    for (const o of obs) {
      if (o.gone || !o.act || o.t === 'bees' || o.t === 'speech' || o.t === 'robe' && o.st === 'hidden') continue;
      if (Math.abs(m.x - o.x) < o.hx + 4 && Math.abs(m.y - o.y) < o.hy + 4 && m.z < o.h) { magHitsObstacle(o); stopMag(m); break; }
    }
  }
  if (mags.length > 60) mags = mags.filter(m => !m.dead);
}
function stopMag(m) { m.done = true; m.vx *= -0.1; m.vy *= 0.2; }

function updateFx() {
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy; p.z += p.vz; p.vz -= 0.25;
    if (p.z < 0) { p.z = 0; p.vz *= -0.3; p.vx *= 0.6; p.vy *= 0.6; }
    p.life--;
  }
  parts = parts.filter(p => p.life > 0);
  for (const f of floats) { f.z += 0.6; f.t--; }
  floats = floats.filter(f => f.t > 0);
  if (G.banner && --G.banner.t <= 0) G.banner = null;
  if (P.bub && --P.bub.t <= 0) P.bub = null;
  for (const w of pows) w.t--;
  pows = pows.filter(w => w.t > 0);
}

// ---- attract mode on the title screen ----
function stepAttract() {
  P.speed = CRUISE; P.y += P.speed; P.anim += 0.08 + P.speed * 0.085;
  P.x = -60 + Math.sin(P.y * 0.004) * 30;
  camY = P.y;
  if (P.y > END - 900) P.y = 40;
  if (P.y % 300 < 2.5 && rand() < 0.5) { P.throwT = 14; }
}

// =====================================================================
//  MAIN STEP
// =====================================================================
function step() {
  G.t++;
  if (G.flash > 0) G.flash--;
  if (G.shake > 0) G.shake--;
  switch (G.state) {
    case 'title':
      stepAttract();
      if (take('up') | take('left')) { G.sel = (G.sel + 2) % 3; SFX.tick(); }
      if (take('down') | take('right')) { G.sel = (G.sel + 1) % 3; SFX.tick(); }
      if (takeGo()) startGame();
      break;
    case 'dayIntro':
      if ((G.t > 40 && takeGo()) || G.t > 330) beginStreet();
      break;
    case 'street':
      if (G.paused) break;
      stepStreet(); updateFx();
      break;
    case 'hallIntro':
      if ((G.t > 40 && takeGo()) || G.t > 260) { G.state = 'hall'; playSong('hall'); }
      break;
    case 'hall':
      if (G.paused) break;
      stepHall(); updateFx();
      break;
    case 'report':
      if (G.t > 50 && takeGo()) nextAfterReport();
      break;
    case 'gameover': case 'win':
      if (G.t > 80 && takeGo()) { G.state = 'title'; buildStreet(true); P.y = 40; }
      break;
  }
  if (!(G.state === 'street' || G.state === 'hall' || G.state === 'title')) { pressed.delete('left'); pressed.delete('right'); }
  if (G.state !== 'title') { pressed.delete('up'); pressed.delete('down'); }
  pressed.delete('start');
  if (G.state !== 'street' && G.state !== 'hall') pressed.delete('throw');
}

// =====================================================================
//  CHARACTER DRAWING (screen-space sprites at projected feet)
// =====================================================================
function folk(X, Y, k, o) {
  ctx.save(); ctx.translate(X, Y); ctx.scale(k * (o.dir || 1), k);
  if (o.rot) ctx.rotate(o.rot);
  const ph = o.phase || 0, mv = o.moving ? 1 : 0;
  const sw = Math.sin(ph) * 0.7 * mv;
  const bob = -Math.abs(Math.sin(ph)) * 2.2 * mv;
  ctx.translate(0, bob);
  const skin = o.skin || '#f1c27d', lean = o.lean || 0;
  const hipY = -26, shY = -45;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const pants = o.pants || '#555', shoe = o.shoe || '#1a1a1a';
  const leg = (a, col) => {
    const kx = Math.sin(a) * 13, ky = hipY + Math.cos(a) * 13;
    const b = a < 0 ? a * 2.5 : a * 0.25;
    const fx = kx + Math.sin(b) * 13, fy = ky + Math.cos(b) * 13;
    ctx.strokeStyle = col; ctx.lineWidth = o.legW || 6;
    ctx.beginPath(); ctx.moveTo(0, hipY); ctx.lineTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
    ctx.fillStyle = shoe; ctx.beginPath(); ctx.ellipse(fx + 2.2, fy - 0.5, 4.6, 2.6, 0, 0, 7); ctx.fill();
  };
  const arm = (a, col, front) => {
    const sxp = lean + 0, syp = shY + 2;
    let ex, ey, hx, hy;
    if (front && o.arm === 'throw') { ex = sxp - 8; ey = syp - 7; hx = sxp - 16; hy = syp - 12; }
    else if (front && o.arm === 'fist') { const w = Math.sin(o.phase * 3) * 2; ex = sxp + 6; ey = syp - 6; hx = sxp + 9 + w; hy = syp - 15; }
    else if (front && o.arm === 'wave') { const w = Math.sin(G.t * 0.3) * 3; ex = sxp + 5; ey = syp - 8; hx = sxp + 7 + w; hy = syp - 18; }
    else if (front && o.arm === 'hold') { ex = sxp + 7; ey = syp + 5; hx = sxp + 15; hy = syp + 3; }
    else if (!front && o.bag) { const ba = a * 0.45; ex = sxp + Math.sin(ba) * 9; ey = syp + Math.cos(ba) * 9; hx = ex + Math.sin(ba) * 9; hy = ey + Math.cos(ba) * 9; }
    else { const fa = a + (mv ? 1.3 : 0.15); ex = sxp + Math.sin(a) * 9; ey = syp + Math.cos(a) * 9; hx = ex + Math.sin(fa) * 9; hy = ey + Math.cos(fa) * 9; }
    ctx.strokeStyle = col; ctx.lineWidth = 4.6;
    ctx.beginPath(); ctx.moveTo(sxp, syp); ctx.lineTo(ex, ey); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(hx, hy, 2.4, 0, 7); ctx.fill();
    return [hx, hy];
  };
  const top = o.top || '#888', topD = shade(top, -0.25);
  // back arm & leg
  const bagHand = arm(-sw * 1.1, topD, false);
  if (o.bag) {
    // square bookbag with two handles, carried at his side
    const [bx, by] = bagHand;
    ctx.strokeStyle = '#2a1a10'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(bx - 4, by + 4); ctx.quadraticCurveTo(bx - 3, by - 2, bx, by - 1); ctx.quadraticCurveTo(bx + 3, by - 2, bx + 4, by + 4); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.fillRect(bx - 5, by + 2, 4, 3); ctx.fillStyle = '#c0262d'; ctx.fillRect(bx - 1, by + 2.5, 3, 2.5);
    ctx.fillStyle = o.bagCol || '#3b2416'; ctx.fillRect(bx - 7, by + 4, 14, 12);
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(bx - 7, by + 4, 14, 1.5);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(bx - 7, by + 14, 14, 2);
    ctx.fillStyle = '#d9b44a'; ctx.fillRect(bx - 1.5, by + 6, 3, 2);
  }
  leg(-sw, shade(pants, -0.2));
  leg(sw, pants);
  // lower garment
  if (o.skirt) { ctx.fillStyle = o.skirt; ctx.beginPath(); ctx.moveTo(-7, hipY - 3); ctx.lineTo(7, hipY - 3); ctx.lineTo(10, hipY + 14); ctx.lineTo(-10, hipY + 14); ctx.closePath(); ctx.fill(); }
  // torso
  ctx.fillStyle = top;
  ctx.beginPath(); ctx.moveTo(lean - 7, shY); ctx.lineTo(lean + 7, shY); ctx.lineTo(7, hipY + 2); ctx.lineTo(-7, hipY + 2); ctx.closePath(); ctx.fill();
  if (o.robe) {
    ctx.fillStyle = o.robe; ctx.beginPath(); ctx.moveTo(lean - 8, shY); ctx.lineTo(lean + 8, shY); ctx.lineTo(10, -6); ctx.lineTo(-10, -6); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade(o.robe, 0.4); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-8, -27); ctx.lineTo(8, -27); ctx.stroke();
  }
  if (o.stripes) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(lean - 6, shY + 1); ctx.lineTo(-6, hipY + 2); ctx.stroke(); }
  if (o.shirt) { ctx.fillStyle = o.shirt; ctx.beginPath(); ctx.moveTo(lean + 2, shY); ctx.lineTo(lean + 7.5, shY); ctx.lineTo(lean + 6.5, shY + 9); ctx.closePath(); ctx.fill(); }
  if (o.tie) {
    ctx.strokeStyle = o.tie; ctx.lineWidth = 2.6;
    ctx.beginPath();
    if (o.tieFlap > 0.4) {
      const w = Math.sin(G.t * 0.9) * 2.5;
      ctx.moveTo(lean + 5.5, shY + 1); ctx.quadraticCurveTo(lean - 2, shY - 4 + w, lean - 12, shY - 2 - w); ctx.lineTo(lean - 16, shY + 1 + w);
    } else { ctx.moveTo(lean + 6, shY + 1); ctx.lineTo(lean + 7, shY + 12); }
    ctx.stroke();
  }
  if (o.tag) { ctx.fillStyle = '#111'; ctx.fillRect(lean + 1, shY + 4, 5, 2.4); ctx.fillStyle = '#fff'; ctx.fillRect(lean + 2, shY + 5, 3, 0.6); }
  if (o.badge) { ctx.fillStyle = '#f2f2f2'; ctx.fillRect(lean + 1, shY + 4, 4, 3); }
  // head
  const hx = lean + 1, hy = shY - 9;
  ctx.fillStyle = skin; ctx.fillRect(hx - 2, shY - 4, 4, 4);
  ctx.beginPath(); ctx.arc(hx, hy, 7.5, 0, 7); ctx.fill();
  ctx.fillStyle = o.hair || '#3a2a1a';
  const hs = o.hairStyle || 'short';
  if (hs === 'afro') { ctx.beginPath(); ctx.arc(hx - 1, hy - 3, 10.5, 0, 7); ctx.fill(); ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(hx + 2.5, hy + 1.5, 5.5, 0, 7); ctx.fill(); }
  else if (hs === 'curly' || hs === 'big') {
    const r = hs === 'big' ? 4.6 : 3.6;
    for (const [a, b] of [[-6, -3], [-3, -7], [1, -8], [5, -6], [-7, 2], [-5, -6]]) { ctx.beginPath(); ctx.arc(hx + a, hy + b, r, 0, 7); ctx.fill(); }
  } else if (hs === 'bald') { ctx.beginPath(); ctx.arc(hx - 4, hy + 1, 4, 1.2, 4.2); ctx.fill(); }
  else {
    ctx.beginPath(); ctx.arc(hx, hy, 8, Math.PI * 0.92, Math.PI * 2.08); ctx.fill();
    ctx.fillRect(hx - 8, hy - 2, 5, 6);
    if (hs === 'side') { ctx.beginPath(); ctx.moveTo(hx - 2, hy - 8); ctx.quadraticCurveTo(hx + 6, hy - 9, hx + 8, hy - 3); ctx.lineTo(hx + 2, hy - 5); ctx.fill(); }
    if (hs === 'bun') { ctx.beginPath(); ctx.arc(hx - 8, hy - 5, 4.2, 0, 7); ctx.fill(); }
    if (hs === 'long') ctx.fillRect(hx - 8.5, hy - 2, 6, 13);
    if (hs === 'mullet') ctx.fillRect(hx - 8.5, hy, 5, 10);
  }
  if (o.hat) { ctx.fillStyle = o.hat; ctx.fillRect(hx - 11, hy - 7, 22, 2.5); ctx.fillRect(hx - 6, hy - 12, 12, 5); }
  if (o.helmet) { ctx.fillStyle = o.helmet; ctx.beginPath(); ctx.arc(hx, hy - 1, 8.5, Math.PI, 0); ctx.fill(); }
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(hx + 4.2, hy - 0.5, 1.1, 0, 7); ctx.fill();
  if (o.glasses) { ctx.strokeStyle = '#333'; ctx.lineWidth = 0.8; ctx.strokeRect(hx + 2.5, hy - 2, 3.5, 2.6); }
  if (o.mouth) { ctx.strokeStyle = '#7a2a1a'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(hx + 4, hy + 3, 1.6, 0.2, 2.6); ctx.stroke(); }
  // front arm
  const hand = arm(sw * 1.1, top, true);
  if (o.holding === 'mag') { ctx.fillStyle = '#fff'; ctx.fillRect(hand[0] - 3, hand[1] - 4, 6, 7); ctx.fillStyle = '#c0262d'; ctx.fillRect(hand[0] - 3, hand[1] - 4, 6, 2); }
  if (o.holding === 'blue') { ctx.fillStyle = '#1f3c7a'; ctx.fillRect(hand[0] - 2, hand[1] - 5, 6, 8); }
  if (o.holding === 'mic') { ctx.strokeStyle = '#999'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(hand[0] - 4, hand[1] + 8); ctx.lineTo(hand[0] + 20, hand[1] - 20); ctx.stroke(); ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(hand[0] + 21, hand[1] - 21, 3, 0, 7); ctx.fill(); }
  ctx.restore();
}

function drawPlayer() {
  const X = sx(P.x, P.y), Y = sy(P.x, P.y, 0);
  shadow(P.x, P.y, 13);
  if (P.inv > 0 && Math.floor(P.inv / 5) % 2) return;
  const base = { dir: 1, phase: P.anim, top: '#24386e', pants: '#6a6e7a', shirt: '#fff', tie: '#c8262d', hair: '#5a3a1e', hairStyle: 'side', bag: true, lean: 3 };
  if (P.crashT > 0) {
    ctx.save(); ctx.translate(X, Y);
    folk(0, 0, SC, Object.assign(base, { rot: -1.45, moving: false, lean: 0 }));
    ctx.restore();
    // dizzy stars
    for (let i = 0; i < 3; i++) {

      txt('*', X - 40 * SC + Math.cos(a) * 9, Y - 10 + Math.sin(a) * 3, 8, '#ffe36b', 'center', false);

}

function drawDog(o) {
  const X = sx(o.x, o.y), Y = sy(o.x, o.y, 0);

  ctx.strokeStyle = shade(c, -0.25); ctx.lineWidth = 3.4; ctx.lineCap = 'round';
  const legs = [[-8, 0], [-5, 1.5], [7, 0.8], [10, 2.3]];
  for (const [lx, o2] of legs) { const s = o.moving && !o.down ? Math.sin(ph + o2 * 2) * 5 : 0; ctx.beginPath(); ctx.moveTo(lx, -12); ctx.lineTo(lx + s, -1); ctx.stroke(); }
  ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(1, -15, 13, 6.5, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(13, -21, 6, 0, 7); ctx.fill();
  ctx.fillRect(15, -21, 7, 4.5);

  if (o.down) { txt('z', 8, -32, 7, '#fff', 'center', false); }
  ctx.restore();
}

function drawCar(o) {
  const x = o.x, y = o.y, L = o.hy, Wd = o.hx;
  const body = o.t === 'police' ? '#f4f4f4' : o.t === 'cargroup' ? '#e9dcc0' : o.col;
  const oncoming = o.vy < 0;
  // wheels
  for (const wy of [y - L + 14, y + L - 14]) {
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.ellipse(sx(x + Wd, wy), sy(x + Wd, wy, 7), 7.5 * SC, 8 * SC, -0.9, 0, 7); ctx.fill();
  }
  if (o.t === 'police') {
    box(x - Wd, x + Wd, y - L, y + L, 5, 15, null, '#1b1b1f', '#1b1b1f');
    box(x - Wd, x + Wd, y - L, y + L, 15, 25, '#f4f4f4', '#ececec', '#d9d9d9');
  } else box(x - Wd, x + Wd, y - L, y + L, 5, 25, shade(body, 0.1), body, shade(body, -0.2));
  if (o.t === 'cargroup') {
    frect(x + Wd, y - L + 4, y + L - 4, 9, 22, '#7a4a22');
    for (let k = -L + 14; k < L - 4; k += 14) line3([x + Wd, y + k, 10], [x + Wd, y + k, 21], '#5a3416', 1);
  }
  // lights on near face
  srect(y - L, x - Wd + 3, x - Wd + 10, 14, 20, oncoming ? '#fff6b0' : '#d82a2a');
  srect(y - L, x + Wd - 10, x + Wd - 3, 14, 20, oncoming ? '#fff6b0' : '#d82a2a');
  // cabin
  const c0 = o.t === 'cargroup' ? y - L + 22 : y - L + 26, c1 = o.t === 'cargroup' ? y + L - 8 : y + L - 26;
  ctx.globalAlpha = 0.6;
  box(x - Wd + 3, x + Wd - 3, c0, c1, 25, 43, null, '#7fb6d4', '#7fb6d4');
  ctx.globalAlpha = 1;
  // passengers, seen through the side windows

    else ctx.fillRect(X - 5, Y - 6, 10, 3);
    if (hat) { ctx.fillStyle = hat; ctx.fillRect(X - 5.5, Y - 7, 11, 2); ctx.fillRect(X - 3, Y - 9.5, 6, 3); }
    ctx.fillStyle = '#111'; ctx.fillRect(X + 2, Y - 1, 1.2, 1.2);
  };
  if (o.t === 'cargroup') {

  } else if (o.t === 'police') head(c0 + 22, '#1d2a4a', null, false, '#e0b48a');
  else head(c0 + 22, '#3a2a1a', null, false);
  ctx.globalAlpha = 0.18;
  box(x - Wd + 3, x + Wd - 3, c0, c1, 25, 43, null, '#cfeaf5', null);
  ctx.globalAlpha = 1;
  box(x - Wd + 3, x + Wd - 3, c0, c1, 42, 44, o.t === 'police' ? '#f4f4f4' : shade(body, 0.12), null, null);

  line3([x + Wd - 3, c1, 25], [x + Wd - 3, c1, 43], shade(body, -0.3), 2);
  line3([x - Wd + 3, c0, 25], [x - Wd + 3, c0, 43], shade(body, -0.3), 2);
  if (o.t === 'police') {

    box(x - 14, x + 14, c0 + 14, c0 + 24, 44, 50, on ? '#ff3030' : '#3060ff', on ? '#ff5050' : '#5080ff', on ? '#c02020' : '#2040c0');
    faceTextX(x + Wd + 0.5, y, 19, 'POLICE', 7, '#111');

}

function drawObstacle(o) {
  const X = sx(o.x, o.y), Y = sy(o.x, o.y, 0);
  switch (o.t) {

    case 'mormons': {
      for (const [dx, hs, hair] of [[-12, 'short', '#c9a35a'], [12, 'short', '#4a2e18']]) {
        shadow(o.x + dx, o.y, 11);
        folk(sx(o.x + dx, o.y), sy(o.x + dx, o.y, 0), SC, { dir: -1, moving: o.st !== 'trade', phase: o.ph + dx, top: '#fafafa', shirt: '#fafafa', tie: '#1a1a1a', tag: true, pants: '#22252d', hair, hairStyle: hs, arm: o.st === 'trade' ? 'hold' : null, holding: o.st === 'trade' && dx < 0 ? 'blue' : null });
      }
      break;
    }
    case 'breakdancer': {
      shadow(o.x, o.y, 16);

      poly([[o.x - 20, o.y - 18, 0.5], [o.x + 20, o.y - 18, 0.5], [o.x + 20, o.y + 18, 0.5], [o.x - 20, o.y + 18, 0.5]], '#b8915a');

      else folk(X, Y - 26 * SC, SC, { rot: Math.PI + Math.sin(o.f * 0.25) * 0.6, dir: Math.sin(o.f * 0.12) > 0 ? 1 : -1, moving: true, phase: o.f * 0.5, top: '#d9302c', pants: '#d9302c', stripes: true, hair: '#1a1a1a', hairStyle: 'afro', skin: '#8d5a3b', shoe: '#fff' });
      if (!o.down && o.f % 30 < 20) txt('♪', X + 14, Y - 40 - (o.f % 30), 9, '#ffe36b', 'center', false);
      break;
    }
    case 'boombox': {
      box(o.x - 8, o.x + 8, o.y - 4, o.y + 4, 0, 13, '#444', '#2a2a2a', '#333');
      for (const dy of [-3, 3]) { ctx.fillStyle = '#888'; ctx.beginPath(); ctx.arc(sx(o.x - 4 + dy * 2, o.y - 4), sy(o.x - 4 + dy * 2, o.y - 4, 6), 2.4, 0, 7); ctx.fill(); }
      line3([o.x - 6, o.y, 13], [o.x - 6, o.y, 18], '#999', 1); line3([o.x + 6, o.y, 13], [o.x + 6, o.y, 18], '#999', 1); line3([o.x - 6, o.y, 18], [o.x + 6, o.y, 18], '#999', 1);
      break;

function drawStreetScene() {
  drawGroundStreet();
  // magazine shadows
  for (const m of mags) if (!m.dead && m.z > 0.5) { ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(sx(m.x, m.y), sy(m.x, m.y, 0), 4, 2, 0, 0, 7); ctx.fill(); }
  const spr = [];
  const yA = camY - 600, yB = camY + 1400;
  for (const h of houses) {
    if (h.y0 + LOT < yA || h.y0 > yB) continue;
    spr.push({ x0: HX0 - 10, x1: HX1, y0: h.y0 + HYA - 10, y1: h.y0 + HYB + 10, fn: () => drawHouse(h) });
    spr.push({ x0: MBX - 7, x1: MBX + 7, y0: h.y0 + MBY - 10, y1: h.y0 + MBY + 10, fn: () => drawMailbox(h) });
  }
  for (const o of obs) {
    if (o.gone || o.y < yA || o.y > yB) continue;
    spr.push({ x0: o.x - o.hx, x1: o.x + o.hx, y0: o.y - o.hy, y1: o.y + o.hy, fn: () => drawObstacle(o) });
  }
  for (const d of decor) if (d.y + (d.hy || 0) > yA && d.y - (d.hy || 0) < yB) { const hx = d.hx || 6, hy = d.hy || 6; spr.push({ x0: d.x - hx, x1: d.x + hx, y0: d.y - hy, y1: d.y + hy, fn: () => drawObstacle(d) }); }
  for (const b of bundles) if (!b.taken && b.y > yA && b.y < yB) spr.push({ x0: b.x - 10, x1: b.x + 10, y0: b.y - 8, y1: b.y + 8, fn: () => drawBundle(b) });
  for (const b of bibles) if (!b.taken && b.y > yA && b.y < yB) spr.push({ x0: b.x - 8, x1: b.x + 8, y0: b.y - 6, y1: b.y + 6, fn: () => drawBible(b) });
  for (const d of donuts) if (!d.taken && d.y > yA && d.y < yB) spr.push({ x0: d.x - 8, x1: d.x + 8, y0: d.y - 6, y1: d.y + 6, fn: () => drawDonut(d) });
  for (const m of mags) if (!m.dead && m.y > yA && m.y < yB) spr.push({ x0: m.x - 3, x1: m.x + 3, y0: m.y - 3, y1: m.y + 3, fn: () => drawMag(m) });
  if (END < yB + 400) spr.push({ x0: -520, x1: 236, y0: END, y1: END + 520, fn: drawKHExterior });
  spr.push({ x0: P.x - 8, x1: P.x + 8, y0: P.y - 6, y1: P.y + 6, fn: drawPlayer });
  for (const a of angels) if (a.st !== 'wait' && a.st !== 'gone') shadow(a.x, a.y, 16, 0.18);
  drawSorted(spr);
  for (const a of angels) drawAngel(a);
  for (const o of obs) if (!o.gone && o.act && o.y > yA && o.y < yB) { labelDraw(o, o.h + 22); bubbleDraw(o, o.h + 14); }
  for (const w of pows) drawPow(w);

}

function drawSorted(spr) {
  for (const s of spr) s.k = AY * (s.x0 + s.x1) / 2 + FY * (s.y0 + s.y1) / 2;
  spr.sort((a, b) => a.k - b.k);
  const before = (a, b) => {
    if (a.x1 <= b.x0) return true; if (b.x1 <= a.x0) return false;
    if (a.y0 >= b.y1) return true; if (b.y0 >= a.y1) return false;
    return a.k < b.k;
  };
  for (let i = 1; i < spr.length; i++) {
    let j = i;
    while (j > 0 && before(spr[j], spr[j - 1])) { const t = spr[j]; spr[j] = spr[j - 1]; spr[j - 1] = t; j--; }
  }
  for (const s of spr) s.fn();
}

function drawBundle(b) {
  shadow(b.x, b.y, 14);
  for (let k = 0; k < 3; k++) box(b.x - 10, b.x + 10, b.y - 8, b.y + 8, k * 4, k * 4 + 4, k === 2 ? '#fdfaf0' : '#f1ead6', '#e5dcc4', k % 2 ? '#c0262d' : '#e9c33a', 'rgba(0,0,0,.2)');
  line3([b.x, b.y - 8, 12.2], [b.x, b.y + 8, 12.2], '#8a5a2a', 1.2);
  line3([b.x - 10, b.y, 12.2], [b.x + 10, b.y, 12.2], '#8a5a2a', 1.2);
  const bob = Math.sin(G.t * 0.12) * 3;
  txt('▼', sx(b.x, b.y), sy(b.x, b.y, 30) + bob, 7, '#ffe36b', 'center');

  }
