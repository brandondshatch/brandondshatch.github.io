  ctx.fillStyle = 'rgba(14,9,22,.72)'; ctx.fillRect(0, 0, W, H);
  txt('KINGDOM HALL', W / 2, 120, 24, '#e9b43c', 'center');
  txt('Everyone you placed with came to the meeting!', W / 2, 160, 8, '#fff', 'center', false);
  txt('Raised hands want the new issue. Throw them one.', W / 2, 182, 8, '#fff', 'center', false);
  txt('Reach the platform before the opening song.', W / 2, 204, 8, '#fff', 'center', false);
  txt('NO RUNNING IN THE HALL.', W / 2, 244, 9, '#ff6b6b', 'center');
  txt('(Run anyway.)', W / 2, 262, 7, '#9a8fae', 'center', false);
  txt(`Literature counter restocked your bag: ${MAXM} magazines`, W / 2, 300, 7, '#e9b43c', 'center', false);
  if (G.t > 40 && Math.floor(G.t / 25) % 2) txt((touchOn ? 'TAP TO CONTINUE' : 'PRESS SPACE'), W / 2, 380, 10, '#fff', 'center');
}

function drawReport() {
  ctx.fillStyle = '#120e1a'; ctx.fillRect(0, 0, W, H);
  const r = G.report, st = G.stats;
  ctx.save(); ctx.translate(W / 2, H / 2 - 4); ctx.rotate(-0.012);
  const pw = 440, ph = 370, x0 = -pw / 2, y0 = -ph / 2;
  ctx.fillStyle = '#f6eed8'; ctx.fillRect(x0, y0, pw, ph);
  ctx.strokeStyle = '#b9a98a'; ctx.lineWidth = 1; ctx.strokeRect(x0 + 6, y0 + 6, pw - 12, ph - 12);
  txt('FIELD SERVICE REPORT', 0, y0 + 30, 13, '#1a1226', 'center', false);
  txt(`Name: Magazine Route Boy        ${DAYS[G.day]}`, x0 + 22, y0 + 54, 7, '#3a2f4a', 'left', false);
  const cols = [['Books', 0], ['Booklets', 0], ['Hours', r.hours], ['Magazines', st.delivered + st.interest + st.hallHits], ['Return Visits', r.kept], ['Bible Studies', r.studies]];
  const cw = (pw - 44) / 6;
  ctx.strokeStyle = '#7a6a8a';
  cols.forEach(([n, v], i) => {
    const cx = x0 + 22 + i * cw;
    ctx.strokeRect(cx, y0 + 66, cw, 54);
    const parts2 = n.split(' ');
    parts2.forEach((p, k) => txt(p, cx + cw / 2, y0 + 80 + k * 9, 5.5, '#3a2f4a', 'center', false));
    txt(String(v), cx + cw / 2, y0 + 112, 11, '#1f3c9a', 'center', false);
  });
  const lines = [
    ['Return visits made', `${st.delivered}`],
    ['  ...of those, in the mailbox', `${st.mail}`],
    ['New interests found', `${st.interest}`],
    ['Windows broken', `${st.windows}`],
    ['Magazines handed out at the hall', `${st.hallHits}`],
    ['Platform bonus', st.hallBonus ? `+${st.hallBonus}` : '-'],
    ['Perfect route bonus', r.perfect ? `+${r.perfectBonus}` : '-'],
    ['RVs missed (dropped)', `${r.lost}`],
    ['New Do Not Calls', `${r.newDnc}${r.dncTotal ? '  (total ' + r.dncTotal + ')' : ''}`],
    ['New RVs joining tomorrow', `${r.joined}`],
  ];
  lines.forEach(([a, b], i) => {
    const y = y0 + 142 + i * 13.5;
    txt(a, x0 + 24, y, 6.5, '#3a2f4a', 'left', false);
    txt(b, x0 + pw - 24, y, 7, '#1f3c9a', 'right', false);
    ctx.strokeStyle = 'rgba(122,106,138,.35)'; ctx.beginPath(); ctx.moveTo(x0 + 22, y + 4); ctx.lineTo(x0 + pw - 22, y + 4); ctx.stroke();
  });
  txt('REMARKS:', x0 + 24, y0 + 290, 7, '#3a2f4a', 'left', false);
  wrapText(r.headline, x0 + 24, y0 + 306, pw - 48, 12, 7, '#c0262d');
  txt(`SCORE ${String(G.score).padStart(7, '0')}`, x0 + 24, y0 + ph - 18, 9, '#1a1226', 'left', false);
  txt(`ROUTE: ${r.remaining}`, x0 + pw - 24, y0 + ph - 18, 9, '#1a1226', 'right', false);
  ctx.restore();
  if (G.t > 50 && Math.floor(G.t / 25) % 2) txt(G.day >= 6 ? (touchOn ? 'TAP TO CONTINUE' : 'PRESS SPACE') : (touchOn ? 'TAP FOR ' : 'PRESS SPACE FOR ') + DAYS[G.day + 1], W / 2, H - 10, 8, '#fff', 'center');
}
function wrapText(s, x, y, maxW, lh, size, col) {
  ctx.font = `${size}px ${FONT}`;
  const words = s.split(' '); let line = '', yy = y;
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { txt(line, x, yy, size, col, 'left', false); line = w; yy += lh; }
    else line = test;
  }
  if (line) txt(line, x, yy, size, col, 'left', false);
}

function drawEnd(win) {
  ctx.fillStyle = '#120e1a'; ctx.fillRect(0, 0, W, H);
  if (win) {
    txt('WEEK COMPLETE!', W / 2, 110, 24, '#e9b43c', 'center');
    txt('Seven days. Every street. Every porch.', W / 2, 150, 8, '#fff', 'center', false);
    txt('The congregation names you', W / 2, 186, 8, '#cfc4e0', 'center', false);
    txt('MAGAZINE ROUTE BOY', W / 2, 220, 16, '#fff', 'center');
    txt('OF THE YEAR', W / 2, 244, 12, '#fff', 'center');
  } else {
    txt('GAME OVER', W / 2, 120, 28, '#ff6b6b', 'center');
    txt(G.endReason, W / 2, 160, 8, '#fff', 'center', false);
    txt('Turn your territory card back in at the counter.', W / 2, 186, 7, '#cfc4e0', 'center', false);
    txt(`You made it to ${DAYS[G.day]}.`, W / 2, 222, 8, '#cfc4e0', 'center', false);
  }
  txt(`FINAL SCORE ${String(G.score).padStart(7, '0')}`, W / 2, 300, 12, '#fff', 'center');
  txt(`HIGH SCORE ${String(G.hi).padStart(7, '0')}`, W / 2, 330, 9, '#e9b43c', 'center');
  if (G.t > 80 && Math.floor(G.t / 25) % 2) txt((touchOn ? 'TAP TO CONTINUE' : 'PRESS SPACE'), W / 2, 400, 10, '#fff', 'center');
}

// =====================================================================
//  RENDER LOOP
// =====================================================================
function render() {
  baseT();
  ctx.clearRect(0, 0, W, H);
  if (G.shake > 0 && !G.paused) { const m = Math.min(6, G.shake * 0.5); ctx.translate(rr(-m, m), rr(-m, m)); }
  switch (G.state) {
    case 'title': drawTitle(); break;
    case 'dayIntro': drawDayIntro(); break;
    case 'street': drawStreetScene(); drawFx(); baseT(); drawHUD(); break;
    case 'hallIntro': drawHallIntro(); break;
    case 'hall': drawHallScene(); drawFx(); baseT(); drawHUD(); break;
    case 'report': drawReport(); break;
    case 'gameover': drawEnd(false); break;
    case 'win': drawEnd(true); break;
  }
}

let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function frame(t) {
  acc += Math.min(100, t - last); last = t;
  while (acc >= STEP) { step(); acc -= STEP; }
  render();
  musicTick();
  requestAnimationFrame(frame);
}

makeLooks();
buildStreet(true);
P.y = 40;
const boot = () => requestAnimationFrame(t => { last = t; frame(t); });
if (document.fonts && document.fonts.load) Promise.all([document.fonts.load(`10px ${FONT}`), document.fonts.load(`40px ${LOGOFONT}`)]).then(boot, boot); else boot();
setTimeout(() => cv.focus(), 50);

// test hook
window.__MRB = { voices: () => Object.keys(voiceBufs).length, clip: k => playClip(voiceKey(k), true), get bibles() { return bibles; }, mk, G, P, get houses() { return houses; }, get obs() { return obs; }, get people() { return people; }, enterHall, finishDay, beginStreet, startGame, endHall, keys, pressed };
})();
</script>
