<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meet Major Tom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #0a0a0a;
      overflow: hidden;
    }

    .lock-bg {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lock-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .gate {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: clamp(32px, 8vh, 80px);
    }

    .gate-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: min(360px, 88vw);
    }

    .gate-label {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
    }

    .gate-row {
      display: flex;
      width: 100%;
      background: rgba(10,10,10,0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 4px;
      overflow: hidden;
    }

    .gate-row:focus-within {
      border-color: rgba(255,255,255,0.5);
    }

    #pw-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 14px 18px;
      font-family: 'Space Mono', monospace;
      font-size: 15px;
      color: #fff;
      letter-spacing: 0.12em;
    }

    #pw-input::placeholder {
      color: rgba(255,255,255,0.28);
      letter-spacing: 0.08em;
    }

    #pw-submit {
      background: transparent;
      border: none;
      border-left: 1px solid rgba(255,255,255,0.12);
      padding: 14px 18px;
      cursor: pointer;
      color: rgba(255,255,255,0.5);
      font-size: 18px;
      line-height: 1;
      transition: color 0.15s;
    }

    #pw-submit:hover { color: #fff; }

    .gate-error {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      color: #d8556e;
      height: 14px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="lock-bg">
  <img src="tom-lock.webp" alt="" />
</div>

<div class="gate">
  <div class="gate-inner">
    <div class="gate-label">Access Required</div>
    <div class="gate-row">
      <input id="pw-input" type="password" placeholder="password" autocomplete="off" autocorrect="off" spellcheck="false" />
      <button id="pw-submit" aria-label="Enter">→</button>
    </div>
    <div class="gate-error" id="gate-error"></div>
  </div>
</div>

<script>
  const input = document.getElementById('pw-input');
  const btn   = document.getElementById('pw-submit');
  const err   = document.getElementById('gate-error');

  function attempt() {
    if (input.value.trim().toLowerCase() === 'linealab') {
      sessionStorage.setItem('mjt_auth', 'ok');
      location.replace('meet-major-tom.html');
    } else {
      err.textContent = 'incorrect';
      input.value = '';
      input.focus();
      setTimeout(() => { err.textContent = ''; }, 2000);
    }
  }

  btn.addEventListener('click', attempt);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });
  input.focus();
</script>

</body>
</html>
