<!doctype html>
<html lang="en">

<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Knolan's Quest">
<meta name="theme-color" content="#0b1a33">
<title>Knolan's Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; height: 100%; background: #0b1a33; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: "Press Start 2P", monospace;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; image-rendering: pixelated; }
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.touch #touch { display: block; }
  .pad { position: absolute; bottom: calc(10px + env(safe-area-inset-bottom)); pointer-events: auto; }
  #dpad { left: calc(12px + env(safe-area-inset-left)); width: 150px; height: 150px; }
  #dpad .b { position: absolute; width: 50px; height: 50px; }
  #bU { left: 50px; top: 0; } #bL { left: 0; top: 50px; } #bR { left: 100px; top: 50px; } #bD { left: 50px; top: 100px; }
  #ab { right: calc(12px + env(safe-area-inset-right)); width: 160px; height: 130px; }
  #bJ { position: absolute; right: 0; bottom: 0; width: 70px; height: 70px; border-radius: 50%; }
  #bA { position: absolute; left: 0; top: 0; width: 76px; height: 76px; border-radius: 50%; }
  .b {
    box-sizing: border-box; border: 2px solid rgba(255,255,255,.55); border-radius: 12px;
    background: rgba(12, 40, 90, .28); color: #fff; font: 11px "Press Start 2P", monospace;
    display: flex; align-items: center; justify-content: center; text-shadow: 0 1px 0 #000;
  }
  .b.on { background: rgba(255, 210, 80, .5); }
  #bA { background: rgba(200, 60, 60, .45); }
  #topbtns { position: absolute; top: calc(6px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right)); display: flex; gap: 8px; pointer-events: auto; }
  #topbtns .b { width: 40px; height: 30px; font-size: 9px; }
  #rotate {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column;
    background: #0b1a33; color: #ffe7a8; font: 12px/2 "Press Start 2P", monospace; text-align: center; padding: 24px; z-index: 5;
  }
  #rotate .ph { font-size: 44px; animation: rot 1.6s ease-in-out infinite; }
  @keyframes rot { 0%,30% { transform: rotate(0) } 60%,100% { transform: rotate(90deg) } }
  @media (orientation: portrait) { body.touch #rotate { display: flex; } }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="400" height="225"></canvas></div>
<div id="touch">
  <div id="dpad" class="pad">
    <div class="b" id="bU" data-k="up">▲</div>
    <div class="b" id="bL" data-k="left">◀</div>
    <div class="b" id="bR" data-k="right">▶</div>
    <div class="b" id="bD" data-k="down">▼</div>
  </div>
  <div id="ab" class="pad">
    <div class="b" id="bA" data-k="fire">ASK</div>
    <div class="b" id="bJ" data-k="jump">JUMP</div>
  </div>
  <div id="topbtns">
    <div class="b" data-k="mute">♪</div>
    <div class="b" data-k="pause">II</div>
  </div>
</div>
<div id="rotate"><div class="ph">📱</div><div>Turn your phone<br>sideways to play</div></div>

  cvs.height = Math.round(H * SC);
  cvs.style.width = Math.round(W * s) + 'px';
  cvs.style.height = Math.round(H * s) + 'px';

  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const grid = rows.map(r => r.padEnd(w, '.'));
  const c = document.createElement('canvas'); c.width = w + 2; c.height = h + 2;
  const g = c.getContext('2d');
  const on = (x, y) => x >= 0 && y >= 0 && x < w && y < h && grid[y][x] !== '.' && pal[grid[y][x]];
  for (let y = -1; y <= h; y++) for (let x = -1; x <= w; x++) {
    if (on(x, y)) { g.fillStyle = pal[grid[y][x]]; g.fillRect(x + 1, y + 1, 1, 1); }
    else if (on(x - 1, y) || on(x + 1, y) || on(x, y - 1) || on(x, y + 1)) { g.fillStyle = OUT; g.fillRect(x + 1, y + 1, 1, 1); }
  }
  // soft top-left light / bottom-right shade pass for a painted feel
  const img = g.getImageData(0, 0, w + 2, h + 2), d = img.data;
  for (let y = 1; y <= h; y++) for (let x = 1; x <= w; x++) {
    if (!on(x - 1, y - 1)) continue;
    const i = (y * (w + 2) + x) * 4;
    const lit = !on(x - 1, y - 2) || !on(x - 2, y - 1);
    const shd = !on(x, y - 1) || !on(x - 1, y);
    const k = lit ? 1.12 : shd ? 0.86 : 1;
    if (k !== 1 && !(d[i] < 40 && d[i + 1] < 40 && d[i + 2] < 50)) {
      d[i] = Math.min(255, d[i] * k); d[i + 1] = Math.min(255, d[i + 1] * k); d[i + 2] = Math.min(255, d[i + 2] * k);
    }
  }
  g.putImageData(img, 0, 0);
  const f = document.createElement('canvas'); f.width = w + 2; f.height = h + 2;
  const fg = f.getContext('2d'); fg.translate(w + 2, 0); fg.scale(-1, 1); fg.drawImage(c, 0, 0);
  return { R: c, L: f, w: w + 2, h: h + 2 };
}

  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);

const MEL = [69, 0, 72, 0, 76, 74, 72, 0, 71, 0, 74, 0, 77, 76, 74, 0, 72, 0, 76, 0, 79, 77, 76, 74, 72, 71, 69, 71, 72, 0, 0, 0,

const BAS = [45, 0, 57, 45, 45, 0, 57, 45, 43, 0, 55, 43, 43, 0, 55, 43, 41, 0, 53, 41, 41, 0, 53, 41, 40, 0, 52, 40, 44, 0, 56, 44];

const keys = { left: false, right: false, up: false, down: false, jump: false, fire: false };
const pressed = {};
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up',
  ArrowDown: 'down', KeyS: 'down', Space: 'jump', KeyZ: 'jump', KeyK: 'jump', KeyX: 'fire', KeyJ: 'fire', KeyF: 'fire' };
addEventListener('keydown', e => {
  audioInit();
  const k = KEYMAP[e.code];
  if (k) { if (!keys[k]) pressed[k] = true; keys[k] = true; e.preventDefault(); }
  if (e.code === 'Enter') pressed.start = true;

});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
addEventListener('blur', () => Object.keys(keys).forEach(k => keys[k] = false));

const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (isTouch) document.body.classList.add('touch');
document.querySelectorAll('#touch .b').forEach(el => {
  const k = el.dataset.k;
  const down = e => {
    e.preventDefault(); audioInit(); el.classList.add('on');
    if (k === 'mute') { setMuted(!muted); return; }
    if (k === 'pause') { pressed.pause = true; return; }
    if (!keys[k]) pressed[k] = true; keys[k] = true; pressed.start = true;
  };
  const up = e => { e.preventDefault(); el.classList.remove('on'); if (k in keys) keys[k] = false; };

// Update
// ------------------------------------------------------------------
function shaftAt(x) { for (let i = 0; i < SHAFTS.length; i++) if (Math.abs(x - SHAFTS[i]) < 10) return i; return -1; }
function pH() { return G.p.duck ? 17 : 32; }
function overlapP(e, ew, eh, ejy = 0) {
  const p = G.p; if (p.elev >= 0 || e.f !== p.f) return false;
  if (Math.abs(p.x - e.x) > (10 + ew) / 2 - 2) return false;
  return p.jy < ejy + eh && p.jy + pH() > ejy;
}

function update(dt) {
  G.t += dt;
  const p = G.p;
  G.shake = Math.max(0, G.shake - dt);

  // --- Florence's Envella cycle (awake 4:00, asleep 4:00)
  const fl = G.flo;
  fl.t -= dt; fl.cd = Math.max(0, fl.cd - dt);
  if (fl.t <= 0) {
    fl.awake = !fl.awake; fl.t = 240;
    if (fl.awake) showBanner('FLORENCE IS AWAKE!', 'Room 312, 3 West. Go ask her!', '#ffc2d8', 3.5);
    else { showBanner('ENVELLA TIME. ZZZ...', 'Florence is asleep for 4:00', '#bcdcf2', 3.5); say(fl, 'Nighty night, dear...', 'sweet', 2.5); }
  }
  if (!fl.awake && p.f === ROOM.f && Math.abs(p.x - ROOM.bedX) < 180) { fl.humT -= dt; if (fl.humT <= 0) { SFX.hum(); fl.humT = 0.6; } }

  // --- elevators
  for (const c of G.cars) {
    if (c.pos !== c.target) {
      const d = c.target - c.pos, st = 1.25 * dt;
      c.pos = Math.abs(d) <= st ? c.target : c.pos + Math.sign(d) * st;
    }
  }

  // --- player
  p.inv = Math.max(0, p.inv - dt); p.throwT = Math.max(0, p.throwT - dt); p.throwAnim = Math.max(0, p.throwAnim - dt);
  p.stun = Math.max(0, p.stun - dt); p.dunce = Math.max(0, p.dunce - dt); p.burn = Math.max(0, p.burn - dt);
  if (p.bub) { p.bub.t -= dt; if (p.bub.t <= 0) p.bub = null; }
  if (p.elev >= 0) {
    const c = G.cars[p.elev]; p.x = c.x;
    if (c.pos === c.target) { p.f = c.target; p.elev = -1; SFX.ding(); }
  } else if (G.state === 'play') {
    const stunned = p.stun > 0;
    const si = shaftAt(p.x);
    p.duck = !stunned && keys.down && p.jy === 0 && si < 0;
    let mv = 0;
    if (!stunned && !p.duck) { if (keys.left) mv -= 1; if (keys.right) mv += 1; }
    if (mv) p.dir = mv;
    p.moving = mv !== 0;
    p.x += mv * 96 * dt + p.kb * dt;
    p.kb *= Math.pow(0.004, dt); if (Math.abs(p.kb) < 5) p.kb = 0;
    p.x = clamp(p.x, 22, WW - 22);
    if (mv) p.walkT += dt;
    if (!stunned && pressed.jump && p.jy === 0 && !p.duck) { p.vy = 218; SFX.jump(); }
    if (p.jy > 0 || p.vy > 0) { p.vy -= 640 * dt; p.jy += p.vy * dt; if (p.jy <= 0) { p.jy = 0; p.vy = 0; } }
    if (!stunned && keys.fire && p.throwT <= 0) {
      G.shots.push({ x: p.x + p.dir * 8, f: p.f, hy: p.duck ? 9 : 21 + p.jy, vx: p.dir * 215, life: 1.05, spin: 0 });
      p.throwT = 0.3; p.throwAnim = 0.15; SFX.throw();
      if (Math.random() < 0.25) float(p.x, floorY(p.f) - 44 - p.jy, pick(KN_Q), '#ffe066');
    }
    // elevator use
    if (si >= 0 && p.jy === 0 && !stunned) {
      const want = keys.up ? p.f + 1 : keys.down ? p.f - 1 : null;
      if (want !== null && want >= 0 && want < NF) {
        const c = G.cars[si];
        if (Math.abs(c.pos - p.f) < 0.001 && c.pos === c.target) { p.elev = si; c.pos = p.f; c.target = want; p.x = c.x; SFX.ding(); }
        else if (c.target !== p.f) c.target = p.f;
      }
    }
  }

  // --- player questions
  for (const s of G.shots) {
    s.x += s.vx * dt; s.life -= dt; s.spin += dt * 12;
    if (s.life <= 0) continue;
    // Florence
    if (s.f === ROOM.f && s.hy < 30) {
      const fx = fl.awake ? ROOM.chairX : ROOM.bedX;
      if (Math.abs(s.x - fx) < (fl.awake ? 9 : 30)) { s.life = 0; askFlorence(); continue; }
    }
    // Dr. P
    const d = G.dr;
    if (d.present && !d.leaving && s.f === d.f && Math.abs(s.x - d.x) < 14 && s.hy < 46) {
      s.life = 0; SFX.bounce();
      say(d, d.mood === 'devil' ? pick(DR_DEVIL) : 'Hmph. Questions go through the proper channels.', d.mood === 'devil' ? 'devil' : 'angel', 1.8);
      if (d.mood === 'devil') d.moodT += 1.5;
      continue;
    }
    for (const n of G.npcs) {
      if (n.f !== s.f || n.state === 'gone' || n.state === 'flee' || n.state === 'talk') continue;
      if (Math.abs(s.x - n.x) < 7 && s.hy < n.h + 2) { s.life = 0; hitNPC(n); break; }
    }
    if (s.life <= 0) continue;
    for (const c of G.cms) {
      if (c.f !== s.f || c.state === 'gone' || c.state === 'flee') continue;
      if (Math.abs(s.x - c.x) < 8 && s.hy > c.jy - 2 && s.hy < c.jy + c.h + 2) { s.life = 0; hitCM(c); break; }
    }
  }
  G.shots = G.shots.filter(s => s.life > 0 && s.x > 0 && s.x < WW);

  // --- NPCs (nurses & doctors)
  for (const n of G.npcs) {
    if (n.bub) { n.bub.t -= dt; if (n.bub.t <= 0) n.bub = null; }
    n.t -= dt;
    if (n.state === 'walk') {
      n.x += n.dir * n.sp * dt; n.walkT += dt;
      if (n.x < 40 || n.x > WW - 40) { n.dir *= -1; n.x = clamp(n.x, 40, WW - 40); }
      if (n.t <= 0) { n.state = 'idle'; n.t = rand(0.8, 2.6); }
    } else if (n.state === 'idle') {
      if (n.t <= 0) { n.state = 'walk'; n.t = rand(2, 5); n.dir = Math.random() < 0.5 ? -1 : 1; }
    } else if (n.state === 'stun') {
      if (n.t <= 0) { n.state = 'walk'; n.t = rand(1, 3); }
    } else if (n.state === 'talk') {
      if (n.t <= 0) { n.state = 'flee'; n.t = 2.2; n.dir = n.x < p.x ? -1 : 1; }
    } else if (n.state === 'flee') {
      n.x += n.dir * 130 * dt; n.walkT += dt * 2;
      if (n.t <= 0 || n.x < 20 || n.x > WW - 20) { n.state = 'gone'; n.gone = rand(14, 22); }
    } else if (n.state === 'gone') {
      n.gone -= dt;
      if (n.gone <= 0) { n.f = randi(0, NF - 1); n.x = awayPos(n.f); n.state = 'walk'; n.hits = 0; n.t = rand(2, 4); }
    }
  }

  // --- Case managers
  const cmSpeed = 48 + G.conveyed * 8;
  for (const c of G.cms) {
    if (c.bub) { c.bub.t -= dt; if (c.bub.t <= 0) c.bub = null; }
    c.t -= dt;
    // hop physics
    if (c.jy > 0 || c.vy > 0) { c.vy -= 500 * dt; c.jy += c.vy * dt; if (c.jy <= 0) { c.jy = 0; c.vy = 0; } }
    if (c.state === 'gone') {
      c.gone -= dt;
      if (c.gone <= 0) { c.f = randi(0, NF - 1); c.x = awayPos(c.f); c.state = 'patrol'; c.hits = 0; c.t = 3; }
      continue;
    }
    if (c.state === 'stun') { if (c.t <= 0) { c.state = 'patrol'; c.t = 1; } continue; }
    if (c.state === 'flee') {

      if (c.t <= 0 || c.x < 20 || c.x > WW - 20) { c.state = 'gone'; c.gone = rand(20, 30); }

      c.state = 'chase'; c.dir = Math.sign(dx) || 1;
      if (Math.abs(dx) > 6) { c.x += c.dir * cmSpeed * dt; c.walkT += dt; }
      c.throwT -= dt;
      if (c.throwT <= 0 && Math.abs(dx) < 210 && Math.abs(dx) > 24) {
        G.eshots.push({ kind: 'paper', x: c.x + c.dir * 8, f: c.f, hy: 25, vx: c.dir * 115, life: 2.5, spin: 0 });
        c.throwT = rand(2.2, 3.6) - G.conveyed * 0.3; SFX.paper();
        if (Math.random() < 0.4) say(c, 'DISCHARGE NOTICE!', 'evil', 1.2);
      }
      if (c.jy === 0 && Math.random() < dt * 0.6) c.vy = 150;
    } else {
      c.state = 'patrol';
      c.x += c.dir * 26 * dt; c.walkT += dt;
      if (c.x < 40 || c.x > WW - 40 || c.t <= 0) { c.dir *= -1; c.x = clamp(c.x, 40, WW - 40); c.t = rand(2, 5); }
    }
    c.cackleT -= dt;
    if (c.cackleT <= 0) {
      c.cackleT = rand(4, 8);
      say(c, pick(CM_LINES), 'evil', 1.6);
      if (sameFloor && Math.abs(dx) < 260) SFX.cackle();
    }
    if (overlapP(c, c.w, c.h, c.jy) && damage('cm', c.x)) {
      const lost = Math.min(G.meter, 15);
      addMeter(-15);
      say(c, pick(['DISCHARGE! Hee hee!', 'Gimme that info!', 'Paperwork! KYAHA!']), 'evil', 1.6);
      if (lost > 0) float(p.x, floorY(p.f) - 44, '-' + lost + ' INFO', '#ff7a7a');
      SFX.cackle();
    }
  }

  // --- Dr. P
  updateDr(dt);

  // --- enemy shots
  for (const e of G.eshots) {
    e.x += e.vx * dt; e.life -= dt; e.spin += dt * 10;
    if (e.life <= 0 || p.elev >= 0 || e.f !== p.f) continue;
    if (Math.abs(e.x - p.x) < 7 && e.hy + 3 > p.jy && e.hy - 3 < p.jy + pH()) {
      e.life = 0;
      if (e.kind === 'fire') { if (damage('burn', e.x)) say(p, 'OW! HOT!', 'normal', 1); }
      else if (damage('paper', e.x)) { addMeter(-10); float(p.x, floorY(p.f) - 44, 'SERVED!', '#ff7a7a'); }
    }
  }
  G.eshots = G.eshots.filter(e => e.life > 0);

  // --- banners, floats, particles
  if (G.banner) { G.banner.t -= dt; if (G.banner.t <= 0) G.banner = null; }
  if (fl.bub) { fl.bub.t -= dt; if (fl.bub.t <= 0) fl.bub = null; }
  for (const f of G.floats) { f.t -= dt; f.y -= 22 * dt; }
  G.floats = G.floats.filter(f => f.t > 0);
  for (const q of G.parts) { q.t -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 90 * dt; }
  G.parts = G.parts.filter(q => q.t > 0);

  // difficulty: extra case managers after each delivery
  while (G.cms.length < 4 + G.conveyed) G.cms.push(mkCM(randi(0, NF - 1)));
}

function updateDr(dt) {
  const d = G.dr, p = G.p;
  if (d.bub) { d.bub.t -= dt; if (d.bub.t <= 0) d.bub = null; }
  if (!d.present) {
    d.next -= dt;
    if (d.next <= 0) {
      d.present = true; d.t = 36; d.leaving = 0; d.won = false;
      d.f = randi(0, NF - 1);
      const choices = SHAFTS.filter(sx => d.f !== p.f || Math.abs(sx - p.x) > 260);
      d.x = pick(choices.length ? choices : SHAFTS); d.dir = Math.random() < 0.5 ? -1 : 1; d.ix = d.x - d.dir * 26;
      d.mood = Math.random() < 0.5 ? 'angel' : 'devil'; d.moodT = rand(5, 8); d.fireT = 1;
      showBanner('!! DR. P IS ON THE FLOOR !!', 'FLOOR ' + (d.f + 1) + ': ' + FLOOR_NAMES[d.f] + '. FIND HIM!', '#ff6a5a', 4);
      SFX.siren(); SFX.ding();
      burst(d.x, floorY(d.f) - 24, '#ffffff', 16, 70);
    }
    return;
  }
  const fy = floorY(d.f);
  if (d.leaving > 0) {
    d.leaving -= dt;
    if (d.leaving <= 0) {
      d.present = false; d.next = rand(42, 65) - G.conveyed * 5;
      burst(d.x, fy - 24, '#ffffff', 20, 80);
      if (d.won && G.conveyed >= GOAL) { G.state = 'win'; G.endT = 0; SFX.fanfare(); }
      else showBanner('DR. P HAS LEFT THE FLOOR', d.won ? 'Keep it up! Gather more info.' : 'Keep gathering info...', '#cfd6ff', 2.5);
    }
    return;
  }
  d.t -= dt;
  if (d.t <= 0) { d.leaving = 1.6; say(d, pick(['I have a case. Goodbye.', 'Off to the OR.', 'Email my office.']), d.mood, 1.6); return; }

  // stroll
  d.x += d.dir * 20 * dt;
  if (d.x < 60 || d.x > WW - 60 || Math.random() < dt * 0.15) d.dir *= -1;
  d.x = clamp(d.x, 60, WW - 60);
  d.ix += ((d.x - d.dir * 26) - d.ix) * Math.min(1, dt * 3);
  d.bubT -= dt;

  // mood swings
  d.moodT -= dt;
  if (d.moodT <= 0) {
    d.mood = d.mood === 'angel' ? 'devil' : 'angel';
    d.moodT = d.mood === 'angel' ? rand(5, 8) : rand(4.5, 7.5);
    if (d.mood === 'devil') { SFX.devil(); say(d, pick(DR_DEVIL), 'devil', 1.5); burst(d.x, fy - 40, '#ff4a2a', 12, 50); }
    else { SFX.angel(); say(d, pick(DR_ANGEL), 'angel', 1.5); burst(d.x, fy - 50, '#fff3a0', 12, 50); }
  }
  const sameFloor = p.elev < 0 && p.f === d.f, dx = p.x - d.x;
  if (d.mood === 'devil' && sameFloor && Math.abs(dx) < 230) {
    d.fireT -= dt;
    if (d.fireT <= 0) {
      d.fireAlt ^= 1;
      const dir = Math.sign(dx) || 1;
      G.eshots.push({ kind: 'fire', x: d.x + dir * 14, f: d.f, hy: d.fireAlt ? 26 : 6, vx: dir * (125 + G.conveyed * 12), life: 2.4, spin: 0 });
      d.fireT = 1.15 - G.conveyed * 0.1; SFX.fire();
    }
  }
  // contact
  if (overlapP(d, 26, 46, 0) && G.p.inv <= 0) {
    if (d.mood === 'devil') {
      damage('burn', d.x); say(d, 'BURN, CLIPBOARD BOY!', 'devil', 1.5);
    } else if (G.meter >= 100) {
      G.conveyed++; G.meter = 0; G.score += 1000; d.won = true;
      say(d, pick(DR_WIN), 'angel', 2.4); d.leaving = 2.4;
      SFX.fanfare(); G.p.inv = 2.5;
      burst(d.x, fy - 30, '#fff3a0', 30, 110, 1);
      float(d.x, fy - 70, 'INFO DELIVERED!', '#ffe066');
      if (G.conveyed < GOAL) showBanner('DELIVERED ' + G.conveyed + ' / ' + GOAL + '!', 'Dr. P actually listened. Keep going!', '#ffe066', 3);
    } else {
      G.p.stun = 1.2; G.p.dunce = 4; G.p.inv = 1.6; G.p.kb = (G.p.x < d.x ? -1 : 1) * 150;
      addMeter(-10);
      say(d, pick(DR_INSULT), 'angel', 2.4); SFX.wah();
      float(G.p.x, floorY(G.p.f) - 50, 'NOT ENOUGH INFO', '#ff9a7a');
    }
  }
}

function txt(s, x, y, size = 6, col = '#fff', align = 'left', sh = '#1a0f14') {
  ctx.font = size + 'px ' + FONT; ctx.textAlign = align; ctx.textBaseline = 'top';
  if (sh) { ctx.fillStyle = sh; ctx.fillText(s, x + size * 0.12 + 0.3, y + size * 0.12 + 0.3); }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function spr(s, wx, footWy, dir) {
  ctx.drawImage(dir < 0 ? s.L : s.R, Math.round(wx - s.w / 2 - camX), Math.round(footWy - s.h + 1 - camY));
}
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x - camX), Math.round(y - camY), w, h); }
function wrap(text, max) {
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) {
    if ((cur + ' ' + w).trim().length > max) { if (cur) lines.push(cur); cur = w; }
    else cur = (cur + ' ' + w).trim();
  }
  if (cur) lines.push(cur); return lines;
}
const BUB = {
  normal: ['#fffdf5', '#2a1c24', '#2a1c24'], info: ['#e9ffe2', '#1d4a18', '#2a1c24'], evil: ['#3a1f4a', '#ffd21f', '#120818'],
  devil: ['#7a1410', '#ffd9a0', '#200505'], angel: ['#fff8d6', '#5a4a10', '#8a7420'], sweet: ['#ffe6ef', '#7a2848', '#7a2848'],
  sleep: ['#dfeaf6', '#3a5a80', '#3a5a80'],
};
function bubble(wx, wtop, b) {
  const [bg, fg, bd] = BUB[b.style] || BUB.normal;
  const lines = wrap(b.text, 22), fs = 5.5, lh = 8;
  const w = Math.max(...lines.map(l => l.length)) * fs + 10, h = lines.length * lh + 6;
  const sx = wx - camX, sy = wtop - camY;
  const bx = clamp(Math.round(sx - w / 2), 2, W - w - 2), by = Math.round(clamp(sy - h - 7, 22, H - h - 4));
  ctx.globalAlpha = Math.min(1, b.t * 4);
  ctx.fillStyle = bd; ctx.fillRect(bx - 1, by, w + 2, h); ctx.fillRect(bx, by - 1, w, h + 2);
  ctx.fillStyle = bg; ctx.fillRect(bx, by, w, h);
  const tx = clamp(sx, bx + 4, bx + w - 4);
  ctx.beginPath(); ctx.moveTo(tx - 3, by + h); ctx.lineTo(tx + 3, by + h); ctx.lineTo(tx, by + h + 5); ctx.closePath();
  ctx.fillStyle = bg; ctx.fill();
  lines.forEach((l, i) => txt(l, bx + w / 2, by + 4 + i * lh, fs, fg, 'center', null));
  ctx.globalAlpha = 1;
}
function heartShape(x, y, s, col) {
  ctx.fillStyle = col;
  const px = [[1, 0], [2, 0], [4, 0], [5, 0], [0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1], [6, 1], [0, 2], [1, 2], [2, 2], [3, 2], [4, 2], [5, 2], [6, 2],
    [1, 3], [2, 3], [3, 3], [4, 3], [5, 3], [2, 4], [3, 4], [4, 4], [3, 5]];
  for (const [a, b] of px) ctx.fillRect(x + a * s, y + b * s, s, s);
}

    : ['ARROWS/WASD MOVE · UP/DOWN ELEVATOR · DOWN DUCK', 'SPACE/Z JUMP · X ASK (THROW A QUESTION) · M MUTE · P PAUSE', 'Fill the INFO meter, then touch DR. P only when he is an ANGEL.', 'Devil Dr. P throws fireballs. Case Managers steal your info!'];
  lines.forEach((l, i) => txt(l, W / 2, 68 + i * 9, 4.2, i < 2 ? '#cfe6ff' : '#fff', 'center'));
  if (Math.floor(titleT * 2.5) % 2) txt(isTouch ? 'TAP TO START' : 'PRESS ENTER TO START', W / 2, 130, 6, '#ffe066', 'center', '#000');
}
function drawEnd(win, dt) {
  G.endT += dt;
  ctx.fillStyle = 'rgba(8,10,28,.85)'; ctx.fillRect(0, 0, W, H);
  if (win) {
    txt('YOU DID IT!', W / 2, 26, 14, '#ffe066', 'center', '#7a2a10');
    txt('Dr. P has all the info he needs.', W / 2, 52, 5.5, '#fff', 'center');
    screenSpr(FLO, W / 2 - 30, 140); screenSpr(KN, W / 2 + 10, 140, -1);
    for (let i = 0; i < 3; i++) heartShape(W / 2 - 20 + i * 12, 86 + Math.sin(G.endT * 3 + i) * 3, 1, '#ff6a9a');
    txt('"That\'s my boy. Now go eat something, dear."', W / 2, 152, 5, '#ffb6d0', 'center');
  } else {
    txt('OUT OF STEAM', W / 2, 30, 12, '#ff7a6a', 'center', '#3a0a0a');
    screenSpr(KN_D, W / 2, 120);
    txt('"Get some rest, sweetie. Then try again."', W / 2, 136, 5, '#ffb6d0', 'center');
    txt('- Florence', W / 2, 146, 4.5, '#ffb6d0', 'center');
  }
  txt('SCORE ' + G.score + '   DELIVERED ' + G.conveyed + '/' + GOAL, W / 2, 170, 5.5, '#fff', 'center');
  if (G.endT > 1.2 && Math.floor(G.endT * 2.5) % 2) txt(isTouch ? 'TAP TO PLAY AGAIN' : 'PRESS ENTER TO PLAY AGAIN', W / 2, 192, 6, '#ffe066', 'center');
}

// ------------------------------------------------------------------
// Main loop
// ------------------------------------------------------------------
let last = performance.now(), paused = false;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, W, H);

  if (STATE === 'title') {
    drawTitle(dt);
    if (pressed.start || pressed.jump || pressed.fire) { audioInit(); newGame(); STATE = 'game'; mNext = 0; }
  } else {
    if (pressed.pause && G.state === 'play') paused = !paused;
    if (!paused && G.state === 'play') update(dt);
    else if (G.state !== 'play') {
      // let particles settle behind the end card
      for (const q of G.parts) { q.t -= dt; }
    }
    musicTick();
    // camera
    const p = G.p;
    const pfy = p.elev >= 0 ? floorY(G.cars[p.elev].pos) : floorY(p.f);
    const tx = clamp(p.x - W / 2, 0, WW - W), ty = clamp(pfy - 150, -10, WH - H);
    camX += (tx - camX) * Math.min(1, dt * 8); camY += (ty - camY) * Math.min(1, dt * 6);
    let sx = 0, sy = 0; if (G.shake > 0) { sx = rand(-2, 2); sy = rand(-2, 2); }
    const cx0 = camX, cy0 = camY; camX = Math.round(camX + sx); camY = Math.round(camY + sy);
    drawBackground();
    drawElevators();
    drawFlorence();
    for (const n of G.npcs) drawNPC(n);
    drawDr();
    for (const c of G.cms) drawCM(c);
    drawPlayer();
    drawShots();
    drawParts();
    drawBubbles();
    camX = cx0; camY = cy0;
    // devil-mode red vignette when on his floor
    if (G.dr.present && G.dr.mood === 'devil' && G.p.f === G.dr.f && G.p.elev < 0) {
      ctx.fillStyle = `rgba(200,30,20,${0.08 + Math.sin(G.t * 8) * 0.04})`; ctx.fillRect(0, 0, W, H);
    }
    drawHUD();
    drawBanner();
    if (paused) {
      ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H);
      txt('PAUSED', W / 2, 90, 12, '#fff', 'center'); txt(isTouch ? 'TAP II TO RESUME' : 'P TO RESUME', W / 2, 112, 5, '#cfe6ff', 'center');
    }
    if (G.state === 'win' || G.state === 'over') {
      drawEnd(G.state === 'win', dt);
      if (G.endT > 1.2 && (pressed.start || pressed.fire || pressed.jump)) { newGame(); paused = false; }
    }
  }
  for (const k in pressed) pressed[k] = false;
  requestAnimationFrame(frame);
}
if (location.hash === '#dev') window.__dev = { get G() { return G; }, newGame, set state(v) { STATE = v; } };
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(frame));
})();
</script>
